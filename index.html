<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>九大シラバス</title>
<style>
#ctl.cc{display:none}#ctlbar{padding:4px 0}
.sitefoot{max-width:760px;margin:24px auto;padding:0 16px 32px;color:var(--sub);font-size:12px;line-height:1.6}
:root{--bg:#f2f5f8;--card:#fff;--ink:#17212b;--sub:#5d6b79;--line:#d8dee5;--ac:#123f80;--acbg:#e2ebf7}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e6ebf0;--sub:#93a1b0;--line:#2b3644;--ac:#8db4ee;--acbg:#1e2d44}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1rem;margin:0 0 6px}h1 a{color:inherit;text-decoration:none}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
#q{width:100%}
.row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.row select{flex:1 1 30%}
#tcls{flex:1 1 100%;order:5}
.chip{min-height:38px;border:1px solid var(--line);background:var(--bg);color:inherit;border-radius:999px;padding:4px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);color:var(--card);border-color:var(--ac)}
main{padding:12px 12px calc(40px + env(safe-area-inset-bottom))}
.count{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;color:inherit;text-decoration:none}
.item:active,.item:hover{border-color:var(--ac)}
.item b{display:block}.meta{color:var(--sub);font-size:.85rem}
.tag{display:inline-block;background:var(--acbg);color:var(--ac);border-radius:4px;padding:0 6px;font-size:.78rem;margin-right:4px}
.more{width:100%;padding:10px}
.back{display:inline-block;margin-bottom:8px;color:var(--ac);text-decoration:none}
h2{font-size:1.15rem;margin:.2em 0}h3{font-size:.95rem;color:var(--ac);border-bottom:1px solid var(--line);margin:1.4em 0 .4em;padding-bottom:2px}
dt{font-size:.82rem;color:var(--sub);margin-top:.7em}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
a{color:var(--ac)}.note{color:var(--sub)}

/* ---- 詳細画面 ---- */
:root{--hh:52px;--ok:#1f7a4d;--okbg:#e1f3ea;--mute:#8a97a5}
@media(prefers-color-scheme:dark){:root{--ok:#6fd3a0;--okbg:#17322a;--mute:#6f7d8b}}
#dbar{display:flex;align-items:center;gap:8px;min-height:36px}
#dbar button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ac);border-radius:999px;padding:4px 14px;font:inherit;font-size:.9rem;cursor:pointer}
#dbar span{font-weight:700;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:10px}
.hero h2{font-size:1.4rem;line-height:1.35;margin:0 0 4px;font-weight:700;letter-spacing:.01em}
.hero .teacher{color:var(--sub);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--acbg);color:var(--ac);border-radius:999px;padding:2px 11px;font-size:.85rem}
.pill.strong{background:var(--ac);color:var(--card);font-weight:700}
.tabs{position:sticky;top:var(--hh);z-index:4;display:flex;gap:4px;overflow-x:auto;background:var(--bg);padding:6px 0;margin:0 -12px 8px;padding-inline:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--sub);border-radius:999px;padding:5px 14px;font-size:.9rem;border:1px solid transparent}
.tabs a.on{color:var(--ac);background:var(--card);border-color:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;scroll-margin-top:calc(var(--hh) + 52px)}
.card>h3{margin:0 0 6px;border:0;padding:0;font-size:1.02rem;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
.grid div{min-width:0}
.grid dt,.f dt{font-size:.78rem;color:var(--sub);margin:0}
.grid dd{margin:0;font-weight:600;overflow-wrap:anywhere;white-space:normal}
.f{margin:0 0 14px}.f:last-child{margin-bottom:0}
.f dd{white-space:pre-wrap;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span,.tags a{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 9px;font-size:.88rem;text-decoration:none;color:inherit}
.tags a{background:var(--acbg);color:var(--ac);border-color:transparent;border-radius:999px;padding:3px 12px}
.clamp{position:relative;max-height:9.6em;overflow:hidden}
.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--card))}
.morebtn{margin-top:4px;border:0;background:none;color:var(--ac);font:inherit;font-size:.9rem;padding:4px 0;cursor:pointer}
.ev{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.ev:last-of-type{border-bottom:0}
.ev b{font-weight:600}.ev .v{font-size:1.5rem;font-weight:700;color:var(--ac);line-height:1.2}
.ev .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--acbg);overflow:hidden}
.ev .bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.unused{margin:8px 0 0;font-size:.82rem;color:var(--mute)}
.fulltext{white-space:pre-wrap;overflow-wrap:anywhere}
.src{display:block;text-align:center;margin:18px 0 6px;padding:10px;border:1px solid var(--line);border-radius:10px;text-decoration:none;background:var(--card)}
.warn{background:var(--acbg);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-bottom:10px}
@media(min-width:560px){.hero h2{font-size:1.6rem}}

/* ---- 案A: 平らなセクション / 太字ゴシック ---- */
:root{--c0:#123f80;--c1:#4f86c6;--c2:#9dbde3;--c3:#6b7f99;--c4:#b9c6d6}
@media(prefers-color-scheme:dark){:root{--c0:#8db4ee;--c1:#5f8fcf;--c2:#3a5f96;--c3:#7f93ad;--c4:#4a5b70}}
h1{font-weight:700}
.item{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 0;margin:0}
.item:hover,.item:active{border-color:var(--line);background:var(--acbg)}
.item b{font-weight:700;line-height:1.45}
.meta{display:block;margin:2px 0 6px}
.tag{background:none;border:1px solid var(--sub);color:var(--ink);border-radius:999px;padding:0 10px;font-size:.8rem}
.tag.s{background:var(--ac);border-color:var(--ac);color:var(--card);font-weight:700}
.sechead{display:flex;align-items:center;justify-content:space-between}
.sechead h2,h2.lh{font-size:1.15rem;font-weight:700;margin:.2em 0}
.lnk{border:0;background:none;color:var(--ac);font:inherit;font-size:.9rem;min-height:44px;padding:0 0 0 12px;cursor:pointer}
#hmore{padding:0}.hist{margin-bottom:14px;border-bottom:1px solid var(--line)}.hist summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--sub)}.hist summary small{font-weight:400}
.hero{background:none;border:0;border-radius:0;padding:8px 0 0;margin-bottom:0}
.hero h2{font-size:1.8rem;font-weight:700;line-height:1.4}
.pill{background:none;border:1px solid var(--sub);color:var(--ink)}
.pill.strong{background:var(--ac);border-color:var(--ac);color:var(--card);font-weight:700}
.src.top{margin:16px 0 0}
.src{border-color:var(--sub);border-radius:10px;background:none;color:var(--ink);min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs{gap:0;border-bottom:1px solid var(--line);margin:14px -12px 0;padding:0 12px}
.tabs a,.tabs a.on{border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 2px 10px;margin-right:20px;background:none}
.tabs a.on{color:var(--ac);border-bottom-color:var(--ac)}
.card{background:none;border:0;border-radius:0;padding:22px 0 6px}
.card>h3{font-size:1.25rem;font-weight:700;margin:0 0 10px}
.clamp::after{background:linear-gradient(transparent,var(--bg))}
.rows{margin:0}.rows>div{display:flex;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.rows dt{width:84px;flex:none;font-size:.8rem;color:var(--sub);margin:0;padding-top:2px}
.rows dd{margin:0;flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere;white-space:normal}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--acbg)}
.stack i{display:block;height:100%}
.lg{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.lk{flex:1;font-weight:500;min-width:0;overflow-wrap:anywhere}
.lv{font-size:1.75rem;font-weight:700;line-height:1}
.legend{margin-top:6px}
.unused{margin:10px 0 0}

/* ---- 成績の見た目を整理 / 評価項目を色で区別 ---- */
:root{--c0:#123f80;--c1:#d9730d;--c2:#188a75;--c3:#8a4fbf;--c4:#8b9aab}
@media(prefers-color-scheme:dark){:root{--c0:#8db4ee;--c1:#f0a35a;--c2:#5ccbb3;--c3:#c39bec;--c4:#9aa8b8}}
.lg{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center}
.lk small{display:block;color:var(--sub);font-size:.78rem;font-weight:400}
.lv{white-space:nowrap;font-size:1.6rem;font-weight:700}
.gn{background:var(--acbg);border-radius:10px;padding:10px 12px;margin-top:10px}
.gn b{display:block;font-size:.8rem;color:var(--sub);font-weight:700}
.gn p{margin:2px 0 0;overflow-wrap:anywhere}
#sems .chip{flex:1 1 0;padding-inline:0;text-align:center}

/* ---- hidden が効かなかった問題の修正 / 表示範囲 ---- */
[hidden]{display:none!important}
.count .lnk{min-height:0;padding:0 0 0 8px;font-size:.85rem}
.lk small.x{margin-top:2px}

/* ---- クラス絞り込み・抽選バッジ・受講条件 ---- */
:root{--wn:#8a4300;--wnbg:#fbe9d7;--ng:#b3261e}
@media(prefers-color-scheme:dark){:root{--wn:#f2b27a;--wnbg:#3a2a1a;--ng:#ff8a80}}
.tag.w{background:var(--wnbg);border-color:transparent;color:var(--wn)}
.tag.no{border-color:var(--ng);color:var(--ng)}
#myrow select{flex:1 1 40%}
.cond{padding:18px 0 4px}
.cond h3{font-size:1.25rem;font-weight:700;margin:0 0 8px}
.verdict{margin:0 0 6px;font-size:1.05rem}
.verdict .ok{color:var(--ok)}.verdict .ng{color:var(--ng)}
.cond .rows dd{font-weight:400}
.srcnote{margin:8px 0 0;font-size:.78rem;color:var(--sub)}
.ver{font-size:.65rem;font-weight:400;color:var(--sub);margin-left:6px}
.plan{list-style:none;margin:6px 0 0;padding:0}
.plan li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan .pn{flex:none;min-width:2.2em;height:1.9em;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--card);border:1px solid var(--ac);color:var(--ac);font-size:.8rem;font-weight:700}
.plan .pb{flex:1;min-width:0;overflow-wrap:anywhere}
.plan .pt{font-weight:700}
.plan .pc small{display:block;color:var(--sub);font-size:.75rem;margin-top:2px}
.plan .pc{margin-top:2px;white-space:pre-wrap}

/* ---- 時間割・プラン・比較・卒業要件 ---- */
.nav{display:flex;gap:2px;margin:0 0 4px;overflow-x:auto;scrollbar-width:none}
.nav a{flex:none;text-decoration:none;color:var(--sub);padding:6px 12px;border-bottom:3px solid transparent;font-size:.92rem}
.nav a.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:700}
.tt{scroll-margin-top:calc(var(--hh,0px) + 8px);display:grid;grid-template-columns:30px repeat(5,minmax(0,1fr));gap:3px;margin:8px 0}
.th{text-align:center;font-weight:700;color:var(--ac);padding:4px 0}
.tl{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);line-height:1.2}
.tl b{font-size:.95rem;color:var(--ink)}.tl small{font-size:.58rem}
.cell{min-height:92px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px;display:flex;flex-direction:column;gap:2px;font:inherit;color:inherit;cursor:pointer;text-align:left;overflow:hidden}
.cell.has{background:var(--acbg);border-color:var(--ac)}
.cell.has.rq{background:var(--okbg);border-color:var(--ok)}
.cell.bad{background:var(--wnbg);border-color:var(--ng)}
.cell.sel{outline:2px solid var(--ac);outline-offset:1px}
.cc{font-size:.82rem;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cc i{font-style:normal;background:var(--ac);color:var(--card);border-radius:3px;padding:0 3px;margin-right:2px;font-size:.68rem}
.cell.rq .cc i{background:var(--ok)}
.tlg{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--sub);margin:-2px 0 6px}.tlg i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid;vertical-align:-1px;margin-right:4px}
.fr{margin:auto;color:var(--mute);font-size:.85rem}.fr small{font-size:.62rem;margin-left:1px}
.panel{border-top:1px solid var(--line);margin-top:14px;padding-top:4px;scroll-margin-top:calc(var(--hh,0px) + 8px)}
.hint{margin:10px 0;padding:10px 12px;border-radius:8px;background:var(--acbg);font-size:.92rem}
.panel h3 .lnk{float:right;font-size:.85rem}
.panel h3{font-size:1.1rem;font-weight:700;margin:10px 0 4px}.panel h3 small{font-weight:400;color:var(--sub);font-size:.8rem}
.panel h4{font-size:.85rem;color:var(--sub);margin:12px 0 2px}
.pi{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pit{flex:1;min-width:0;color:inherit;text-decoration:none;display:block}.pit b{display:block;line-height:1.4}
.pib{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:44%}
.chip.add{flex:none}
.wl{margin:4px 0;padding:8px 10px;border-radius:8px;font-size:.9rem}
.wl.bad{background:var(--wnbg);color:var(--ng)}.wl.warn{background:var(--wnbg);color:var(--wn)}.wl.note{background:var(--acbg);color:var(--ac)}
details{margin:8px 0}summary{cursor:pointer;color:var(--ac);padding:6px 0}
.pbox{margin:10px 0 0}.rel{display:block;margin-top:10px;font-size:.9rem}.rel b{display:block;font-size:.82rem;color:var(--sub);margin-bottom:2px}
a.rel.cmp{padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;background:var(--card)}
.cmp{padding:12px 0;border-bottom:1px solid var(--line)}.cmph{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.cmph a{color:inherit;text-decoration:none;font-size:1.05rem}
.cmp .stack{margin-top:8px}.cl{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:.85rem}.cl .sw{display:inline-block;vertical-align:-2px;margin-right:4px;width:11px;height:11px}
.gsec{margin:0 0 22px}.gsec>h3{font-size:1.25rem;font-weight:700;margin:16px 0 8px;color:var(--ink);border:0}.gsec>h3 small{font-weight:400;color:var(--sub);font-size:.85rem}
.grow{padding:11px 0;border-bottom:1px solid var(--line)}.gh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.gn2{font-weight:700;color:var(--ac);white-space:nowrap}
.gbar{height:10px;border-radius:5px;background:var(--acbg);overflow:hidden;margin:6px 0 2px}.gbar i{display:block;height:100%;float:left}.gbar .d{background:var(--ac)}.gbar .p{background:var(--ac);opacity:.35}
.total .big{font-size:2.2rem;font-weight:700;line-height:1.2}.total .big small{font-size:.9rem;font-weight:400;color:var(--sub)}
.stp{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:.85rem}.stp button{border:1px solid var(--line);background:var(--bg);color:var(--ac);border-radius:8px;width:44px;height:40px;font:inherit;cursor:pointer}
.sgl{margin-top:8px;font-size:.9rem}.mk{display:inline-block;min-width:1.4em;text-align:center;margin-right:4px;color:var(--wn)}
.chip.st.on{background:var(--ac);color:var(--card);border-color:var(--ac)}
.mdc{padding:6px 0}
</style>
</head>
<body>
<header><div class="wrap">
<h1 id="h1"><a href="#/">九大シラバス</a> <small class="ver">v0930-時間割</small></h1>
<nav id="nav" class="nav" hidden></nav>
<div id="dbar" hidden><button id="bk" type="button" aria-label="前の画面に戻る">‹ 戻る</button><span id="dtitle"></span></div>
<div id="ctlbar" hidden><button class="chip" id="ctlt" type="button">検索・絞り込みを開く ▾</button></div>
<div id="ctl" hidden>
<input id="q" type="search" placeholder="講義名・教員・キーワード" autocomplete="off">
<div class="row" id="sems"></div>
<div class="row"><select id="sem"></select><select id="cat"></select><select id="sub"></select><select id="per"></select></div>
<div class="row" id="myrow" hidden><select id="cls" aria-label="自分のクラス"></select><select id="place"></select></div>
<p class="srcnote" id="btnote" hidden></p>
<p class="srcnote" id="btver"></p>
<div class="row" id="myrow2" hidden><button class="chip" id="mine" type="button" aria-pressed="false">受講可のみ</button><button class="chip" id="nolot" type="button" aria-pressed="false">抽選なし</button></div>
<div class="row" id="days"></div>
</div></div></header>
<main><div class="wrap" id="view"></div></main>
<footer class="sitefoot">非公式の閲覧サイトです。九州大学とは関係ありません。出典: Campusmate(九大シラバス)・履修資料(B表・学生便覧)。内容は正確とは限らないため、履修の判断は必ず公式の情報で確認してください。最終更新: 2026年10月1日</footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zen=s=>s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
const DAYS=['月','火','水','木','金'];
const SEMS=['前期','後期','春','夏','秋','冬'];
const BASESEM=new Set(['前期','後期','春学期','夏学期','秋学期','冬学期']);
// トップに出す授業(学部カテゴリ)。他学部は「すべての学部を表示」で見られる
const SCOPE=/基幹教育|芸術工/;
// クラス記号(A表より)。value = B表の担当クラスと同じ書き方
const CLASSDEF=[['共創学部',[['I1-1',''],['I1-2',''],['I1-3','']]],
 ['文学部',[['L1-1',''],['L1-2',''],['L1-3',''],['L1-4','']]],['教育学部',[['L1-5','']]],['法学部',[['L1-6',''],['L1-7',''],['L1-8',''],['L1-9','']]],
 ['経済学部',[['L1-10','経済・経営'],['L1-11','経済・経営'],['L1-12','経済・経営'],['L1-13','経済工学'],['L1-14','経済工学']]],
 ['理学部',[['S1-1','物理'],['S1-2','化学'],['S1-3','地球惑星科学'],['S1-4','数学'],['S1-5','生物']]],

const LABEL2SEC=Object.fromEntries(Object.entries(LABELS).flatMap(([s,ls])=>ls.map(l=>[l,s])));
function splitFull(text){
  const lines=text.split('\n'),out={};let cur=null,buf=[],n=0;
  const flush=()=>{if(cur){let k=cur.l,i=2;const sec=out[cur.s]=out[cur.s]||{};while(k in sec)k=cur.l+`(${i++})`;sec[k]=buf.join('\n').trim()}buf=[]};
  for(const raw of lines){
    const x=raw.trim().replace(/[:：]$/,'');
    if(LABEL2SEC[x]&&!(cur&&cur.l===x&&!buf.length)){flush();cur={l:x,s:LABEL2SEC[x]};n++}
    else if(cur)buf.push(raw);
  }
  flush();
  return n>=3?out:null;
}
// 詳細JSONを {見出し:{項目:内容}} にそろえる(全文形式は項目ごとに分ける)
const BOIL={labels:new Set(['授業計画']),pairs:new Set()};   // どの講義でも同じ項目(data/boilerplate.json でも追加できる)
function normalize(d){
  const secs=d.sections||{},res={};
  for(const [t,f] of Object.entries(secs)){
    if(f&&f['全文']){
      const sp=splitFull(f['全文']);
      if(sp){for(const [st,sf] of Object.entries(sp))res[st]={...(res[st]||{}),...sf};continue}
      res[t]={...f};res[t]['全文']=f['全文'];continue;
    }
    res[t]={...(res[t]||{}),...f};
  }
  for(const f of Object.values(res))for(const [k,x] of Object.entries(f)){
    const b=k.replace(/\(\d+\)$/,'');
    if(k!=='全文'&&(BOIL.labels.has(b)||BOIL.pairs.has(b+'\u0000'+String(x).trim())))delete f[k];
  }
  return res;
}

function parseGrade(f){
  const rows=[],notes=[],unused=[];
  const NOTE=/基準|方法|備考|注意|コメント|詳細|について/, MISC=/出席|欠席|その他|備考|注意/;
  const PLINE=/^(.+?)[\s:：=＝]*(\d+(?:\.\d+)?\s*[%％])\s*$/;
  for(const [k,v0] of Object.entries(f)){
    const v=String(v0||'').trim();if(!v)continue;
    const ls=v.split('\n').map(x=>x.trim()).filter(Boolean);
    if(ls.length>=2&&ls.every(x=>PLINE.test(x))){for(const x of ls){const m=x.match(PLINE);rows.push({k:m[1].trim(),n:parseFloat(m[2]),v:m[2].replace(/\s/g,''),sub:'',extra:''})}continue}
    if(NOTE.test(k)){notes.push([k,v]);continue}
    if(isNone(v)){unused.push(k);continue}
    const ms=[...v.matchAll(/(\d+(?:\.\d+)?)\s*[%％]/g)];
    // 「（60%）」のようにカッコで囲まれた割合を優先。なければ最初の割合(短い値、または割合が1つだけの長文)
    const wrapped=ms.find(m=>/[（(]\s*$/.test(v.slice(0,m.index))&&/^\s*[)）]/.test(v.slice(m.index+m[0].length)));
    const pick=wrapped||(ms.length&&(v.length<=24||(ms.length===1&&!MISC.test(k)))?ms[0]:null);
    if(!pick){notes.push([k,v]);continue}
    let st=pick.index,en=pick.index+pick[0].length;
    const pre=v.slice(0,st).match(/[（(]\s*$/),post=v.slice(en).match(/^\s*[)）]/);
    if(pre&&post){st-=pre[0].length;en+=post[0].length}
    let rest=(v.slice(0,st)+' '+v.slice(en)).replace(/\s+/g,' ').trim();
    let extra='';const x=rest.indexOf('※');
    if(x>=0){extra=rest.slice(x).trim();rest=rest.slice(0,x).trim()}
    rest=rest.replace(/^[\s:：=＝()（）]+|[\s:：=＝]+$/g,'');
    rows.push({k,n:parseFloat(pick[1]),v:pick[1]+'%',sub:rest,extra});
  }
  return{rows,notes,unused};
}
function gradeHTML(f){
  const{rows,notes,unused}=parseGrade(f);

}

/* ---------- Ⅰ→Ⅱ の関連づけ・同名科目 ---------- */
const ROMAN={'Ⅰ':1,'Ⅱ':2,'Ⅲ':3,'Ⅳ':4,'Ⅴ':5},ROMANS=['','Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ'];
const nameKey=n=>zen(String(n||'')).replace(/[\s\u3000]+/g,' ').trim();
function seriesOf(n){
  const s=nameKey(n);
  let m=s.match(/^(.*?)\s*([ⅠⅡⅢⅣⅤ])(\s*[（(][^）)]*[）)])?$/);
  if(m)return{base:m[1]+'|'+(m[3]||'').trim(),idx:ROMAN[m[2]],st:'r'};
  m=s.match(/^(.*\S)\s+(\d)(\s*[（(][^）)]*[）)])?$/);
  if(m&&+m[2]<=9)return{base:m[1]+'|'+(m[3]||'').trim(),idx:+m[2],st:'d'};
  m=s.match(/^(.*\S)\s+(I{1,3}|IV|V)$/);
  if(m)return{base:m[1]+'|',idx:{I:1,II:2,III:3,IV:4,V:5}[m[2]],st:'a'};
  return null;
}
function buildSeries(){
  SER.clear();
  for(const c of DATA){
    const s=seriesOf(c.n);c._ser=s;
    if(!s)continue;
    const k=s.base+'#'+s.idx;
    if(!SER.has(k))SER.set(k,[]);
    SER.get(k).push(c);
  }
}
const serLabel=(s,i)=>s.st==='r'?ROMANS[i]:s.st==='a'?['','I','II','III','IV','V'][i]:String(i);
function relHTML(c){
  let h='';
  if(c._ser){
    const s=c._ser;
    for(const [d,lab] of [[1,'つづきの科目'],[-1,'前の科目']]){
      let a=(SER.get(s.base+'#'+(s.idx+d))||[]).filter(x=>!CLS||!x.b||elig(x)!=='no');
      a=a.sort((x,y)=>(y.t===c.t)-(x.t===c.t));
      if(!a.length)continue;
      h+=`<div class="rel"><b>${lab}(${serLabel(s,s.idx+d)})</b><div class="tags">${a.slice(0,5).map(x=>`<a href="#/c/${esc(x.c)}">${x.t===c.t?'同じ教員 ':''}${esc(x.t)}　${esc((x.when[0]||'').replace(/[\s\u3000]+/g,' '))}</a>`).join('')}</div>${a.length>5?`<p class="srcnote">他 ${a.length-5}件。一覧で「${esc(s.base.split('|')[0])}」を検索してください</p>`:''}</div>`;
    }
  }
  const same=DATA.filter(x=>nameKey(x.n)===nameKey(c.n));
  if(same.length>=2)h+=`<a class="rel cmp" href="#/w?n=${encodeURIComponent(nameKey(c.n))}">同じ科目名の授業 ${same.length}件を、成績配分で比べる →</a>`;
  return h;
}
function planBoxHTML(c){
  const st=PL.p[c.c]||'';
  return `<div class="pbox" id="relbox" data-code="${esc(c.c)}"><div class="row">${st?`<span class="tag s">${stLabel[st]}</span>`:''}${st!=='plan'?`<button class="chip" data-set="plan" data-code="${esc(c.c)}">履修予定に入れる</button>`:''}${st!=='done'?`<button class="chip" data-set="done" data-code="${esc(c.c)}">修得済みにする</button>`:''}${st?`<button class="chip" data-set="" data-code="${esc(c.c)}">外す</button>`:''}</div>${relHTML(c)}</div>`;
}

/* ---------- 同名科目の比較 ---------- */
const GC={};
async function gradeOf(code){
  if(GC[code])return GC[code];
  try{
    const r=await fetch(`data/detail/${encodeURIComponent(code)}.json`);if(!r.ok)throw 0;
    const secs=normalize(await r.json());let rows=[];
    for(const [t,f] of Object.entries(secs))if(kindOf(t)[0]==='grade')rows=rows.concat(parseGrade(Object.fromEntries(Object.entries(f).filter(([,x])=>x&&String(x).trim()))).rows);
    return GC[code]={rows};
  }catch(e){return GC[code]={rows:[],err:1}}
}
const sumBy=(rows,re)=>rows.filter(r=>re.test(r.k)).reduce((a,r)=>a+r.n,0);
const METRIC={
  name:['教員名順',()=>0],
  exam:['試験が少ない順',r=>sumBy(r,/試験|テスト/)],
  report:['レポート・課題が多い順',r=>-sumBy(r,/レポート|課題|作品|発表/)],
  attend:['出席・参加が多い順',r=>-sumBy(r,/出席|貢献|参加|平常/)]};
function cmpBar(rows){
  const tot=rows.reduce((a,r)=>a+r.n,0);
  if(!rows.length)return '<p class="note">成績配分を読み取れませんでした</p>';
  return `<div class="stack">${rows.map((r,i)=>`<i style="width:${r.n/Math.max(tot,100)*100}%;background:var(--c${i%5})"></i>`).join('')}</div><div class="cl">${rows.map((r,i)=>`<span><i class="sw" style="background:var(--c${i%5})"></i>${esc(r.k)} <b>${esc(r.v)}</b></span>`).join('')}</div>`;
}

    });
    box.innerHTML=arr.map(({c,g})=>`<section class="cmp"><div class="cmph"><a href="#/c/${esc(c.c)}"><b>${esc(c.t||'担当未定')}</b></a>${PL.p[c.c]?` <span class="tag s">${stLabel[PL.p[c.c]]}</span>`:''}${badgeHTML(c)}</div><span class="meta">${c.when.map(w=>esc(w.replace(/[\s\u3000]+/g,' '))).join(' / ')}${c.b&&c.b.cls?'　'+esc(c.b.cls):''}</span>${g?cmpBar(g.rows):'<p class="note">読み込み中…</p>'}</section>`).join('')||'<p class="note">該当する授業がありません。</p>';

/* ---------- 卒業要件 ---------- */
function mdStatus(name){
  if(PL.md[name])return PL.md[name]==='-'?'':PL.md[name];
  const c=DATA.find(x=>PL.p[x.c]&&nameKey(x.n)===nameKey(name));
  return c?PL.p[c.c]:'';
}
function kibanEarn(g){
  let d=0,pl=0;
  if(g.match){const re=new RegExp(g.match);for(const {c,st} of planned()){if(c.b&&re.test(c.b.cat)){st==='done'?d+=crOf(c):pl+=crOf(c)}}}
  const adj=PL.adj[g.id]||0;
  return{d:d+adj,pl};
}
function bar(d,pl,req){
  const w=x=>Math.min(100,x/req*100);
  return `<div class="gbar" role="img" aria-label="${d}/${req}"><i class="d" style="width:${w(d)}%"></i><i class="p" style="width:${Math.max(0,w(d+pl)-w(d))}%"></i></div>`;
}
function stepper(id,val,label){
  return `<span class="stp"><button type="button" data-adj="${id}" data-dv="-1" aria-label="減らす">−</button><b>${label||'手入力'} ${val}</b><button type="button" data-adj="${id}" data-dv="1" aria-label="増やす">＋</button></span>`;
}
function renderGrad(){
  const v=$('#view');$('#ctl').hidden=true;
  if(!ALL_REQS){v.innerHTML='<h2 class="lh">卒業要件</h2><p class="note">data/all_reqs.json が読み込めません。data フォルダに置いてください。</p>';return}
  const p=params();
  let cid=p.get('c');
  if(!cid){
    const ck=(upM()||/^S1-(\d\d)$/.exec(CLS||'')||[])[1];
    if(ck==='31'||ck==='33') cid='芸術工学部 芸術工学科 メディアデザインコース';
    else cid='共創学部';
  }
  const R=ALL_REQS.find(r=>r.course===cid)||ALL_REQS[0];
  cid=R.course;
  const sel=`<select id="course_select" style="margin-left:1em;font-size:1rem">${ALL_REQS.map(r=>`<option value="${esc(r.course)}"${r.course===cid?' selected':''}>${esc(r.course)}</option>`).join('')}</select>`;
  let out=`<h2 class="lh" style="display:flex;align-items:center;flex-wrap:wrap">卒業要件 ${sel}</h2>`;
  if(R.source) out+=`<p class="srcnote">${esc(R.source)}</p>`;
  let doneAll=0,planAll=0;
  // --- 基幹教育
  const K=R.kiban;let kd=0,kp=0,excess=0;const kr=[];
  for(const g of K.groups){
    if(g.other)continue;
    const e=kibanEarn(g),tot=e.d+e.pl;
    if(['kb-en','kb-l2','kb-bun','kb-ri','kb-hs','kb-so','kb-hi'].includes(g.id))excess+=Math.max(0,tot-g.req);
    kr.push({g,e});
  }
  const og=K.groups.find(g=>g.other);
  const oadj=PL.adj[og.id]||0,oauto=Math.min(og.req,excess);
  let hk=`<section class="gsec"><h3>基幹教育科目 <small>${K.total}単位</small></h3>`;
  for(const {g,e} of kr){
    const cap=Math.min(e.d,g.req),capP=Math.min(e.d+e.pl,g.req)-cap;
    kd+=cap;kp+=capP;
    hk+=`<div class="grow"><div class="gh"><b>${esc(g.name)}</b><span class="gn2">${e.d}${e.pl?`(+${e.pl})`:''} / ${g.req}${e.d>=g.req?' ✓':''}</span></div>${bar(e.d,e.pl,g.req)}<p class="srcnote">${esc(g.note||'')}</p>${stepper(g.id,PL.adj[g.id]||0,'手入力の修得単位')}</div>`;
  }
  const od=Math.min(og.req,oauto+oadj);kd+=od;
  hk+=`<div class="grow"><div class="gh"><b>${esc(og.name)}</b><span class="gn2">${od} / ${og.req}${od>=og.req?' ✓':''}</span></div>${bar(od,0,og.req)}<p class="srcnote">${esc(og.note||'')}(自動: 各区分の超過分 ${oauto}単位)</p>${stepper(og.id,oadj,'手入力(他コース等)')}</div></section>`;
  // --- 専攻教育
  const S=R.senkou;const gs={};
  const cnt=courses=>{let d=0,pl=0;for(const c of courses){const st=mdStatus(c.n);if(st==='done')d+=c.cr;else if(st==='plan')pl+=c.cr}return{d,pl}};
  const courseList=(courses)=>`<details><summary>科目 ${courses.length}件を開く</summary>${courses.map(c=>{const st=mdStatus(c.n);return `<div class="pi mdc"><span class="pit"><b>${c.t?`<span class="mk">${c.t}</span>`:''}${esc(c.n)}</b><span class="meta">${c.cr}単位　<a href="#/?q=${encodeURIComponent(c.n)}">シラバスで探す</a></span>${c.note?`<span class="srcnote">${esc(c.note)}</span>`:''}</span><button type="button" class="chip st${st?' on':''}" data-md="${esc(c.n)}">${st==='done'?'修得済み':st==='plan'?'履修予定':'未'}</button></div>`}).join('')}</details>`;
  let hs=`<section class="gsec"><h3>専攻教育科目 <small>${S.total}単位</small></h3>`;
  if(S.groups && S.groups.length > 0){
    for(const g of S.groups){
      if(g.derived)continue;
      let d=0,pl=0,body='';
      if(g.sub){
        for(const sg of g.sub){const c=cnt(sg.courses);d+=c.d;pl+=c.pl;const ok=c.d>=sg.min;body+=`<div class="sgl"><b>${esc(sg.name)}</b> <span class="gn2">${c.d}${c.pl?`(+${c.pl})`:''}単位 ${ok?'✓':`(${sg.min}単位以上が必要)`}</span></div>`+courseList(sg.courses)}
      }else{const c=cnt(g.courses);d=c.d;pl=c.pl;body=courseList(g.courses)}
      gs[g.id]={d,pl};
      const cap=Math.min(d,g.req);
      doneAll+=cap;planAll+=Math.min(d+pl,g.req)-cap;
      hs+=`<div class="grow"><div class="gh"><b>${esc(g.name)}</b><span class="gn2">${d}${pl?`(+${pl})`:''} / ${g.req}${d>=g.req?' ✓':''}</span></div>${bar(d,pl,g.req)}${g.note?`<p class="srcnote">${esc(g.note)}</p>`:''}${body}</div>`;
    }
    const dg=S.groups.find(g=>g.derived),oth=PL.adj['sk-other']||0;
    const exD=Math.max(0,(gs['sk-sen']||{d:0}).d-25)+Math.max(0,(gs['sk-pbl']||{d:0}).d-20)+oth;
    const exP=Math.max(0,((gs['sk-sen']||{d:0,pl:0}).d+(gs['sk-sen']||{pl:0}).pl)-25)+Math.max(0,((gs['sk-pbl']||{d:0,pl:0}).d+(gs['sk-pbl']||{pl:0}).pl)-20)+oth-exD;
    const dd=Math.min(dg.req,exD),dp=Math.min(dg.req-dd,Math.max(0,exP));
    doneAll+=dd;planAll+=dp;
    hs+=`<div class="grow"><div class="gh"><b>${esc(dg.name)}</b><span class="gn2">${dd}${dp?`(+${dp})`:''} / ${dg.req}${dd>=dg.req?' ✓':''}</span></div>${bar(dd,dp,dg.req)}<p class="srcnote">${esc(dg.note)}</p>${stepper('sk-other',oth,'他コースの専門・演習')}<p class="srcnote">他コース科目 ${oth}単位 ${oth>=4?'(4単位以上の条件を満たしています)':'(4単位以上が必要)'}</p></div></section>`;
  } else {
    const sd=PL.adj['senkou_done']||0,sp=PL.adj['senkou_plan']||0;
    doneAll+=sd;planAll+=sp;
    hs+=`<div class="grow"><div class="gh"><b>専攻教育科目</b><span class="gn2">${sd}${sp?`(+${sp})`:''} / ${S.total}${sd>=S.total?' ✓':''}</span></div>${bar(sd,sp,S.total)}<p class="srcnote">※このコースの専攻教育科目の集計機能は未対応です。手入力で修得単位を足してください。</p>${stepper('senkou_done',sd,'修得済み手入力')} ${stepper('senkou_plan',sp,'履修予定手入力')}</div></section>`;
  }
  const tD=kd+doneAll,tP=kp+planAll;
  out+=`<section class="gsec total"><h3>合計 <small>卒業要件 ${R.total}単位</small></h3><div class="big">${tD}<small> / ${R.total}単位 修得済み${tP?`(予定を入れると ${tD+tP})`:''}</small></div>${bar(tD,tP,R.total)}<p class="srcnote">各区分は上限(必要単位)までを数えています。あと ${Math.max(0,R.total-tD)}単位。</p></section>`+hk+hs;
  out+=`<section class="gsec"><h3>履修条件・注意</h3>${R.rules.map(r=>`<p class="srcnote" style="font-size:.85rem">${esc(r)}</p>`).join('')}<p class="srcnote">単位は履修プランの「修得済み」「履修予定」と、この画面の手入力から集計しています。正式な確認は学務システム・便覧で行ってください。</p></section>`;
  v.innerHTML=out;
}

/* ---------- 共通: ナビ・イベント・初期化 ---------- */
function renderNav(){
  const h=location.hash,items=[['#/','一覧',h===''||h==='#'||h.startsWith('#/?')||h==='#/'],['#/t','時間割',h.startsWith('#/t')],['#/g','卒業要件',h.startsWith('#/g')],['#/w','科目比較',h.startsWith('#/w')]];
  const n=$('#nav');n.hidden=h.startsWith('#/c/');
  n.innerHTML=items.map(([u,l,on])=>`<a href="${u}"${on?' class="on"':''}>${l}</a>`).join('');
}
function rerender(){
  const h=location.hash;
  if(h.startsWith('#/t'))renderTT();else if(h.startsWith('#/g'))renderGrad();else if(h.startsWith('#/w'))renderCmp();
}
function bumpTT(code){/* 追加・削除のあと、同じ画面を描き直す */rerender()}
$('#view').addEventListener('click',e=>{
  const t=e.target,by=s=>t.closest(s);let b;
  if(b=by('[data-totop]')){document.querySelector('.tt').scrollIntoView({behavior:'smooth',block:'start'});return}
  if(b=by('[data-cell]')){const p=params(),k=b.dataset.cell;p.get('s')===k?p.delete('s'):p.set('s',k);history.replaceState(null,'','#/t?'+p);const y=scrollY,opening=p.get('s')===k;renderTT();scrollTo(0,y);if(opening){const pn=document.querySelector('.panel');if(pn)pn.scrollIntoView({behavior:'smooth',block:'start'})}return}
  if(b=by('[data-tt]')){const p=params();p.set('t',b.dataset.tt);p.delete('s');history.replaceState(null,'','#/t?'+p);renderTT();return}
  if(b=by('[data-nolot]')){const p=params();p.get('nolot')?p.delete('nolot'):p.set('nolot','1');history.replaceState(null,'','#/t?'+p);renderTT();return}
  if(b=by('[data-add]')){const y=scrollY;setPlan(b.dataset.add,'plan');renderTT();scrollTo(0,y);return}
  if(b=by('[data-rm]')){const y=scrollY;setPlan(b.dataset.rm,'');bumpTT();scrollTo(0,y);return}
  if(b=by('[data-done]')){const y=scrollY;setPlan(b.dataset.done,'done');bumpTT();scrollTo(0,y);return}
  if(b=by('[data-back]')){const y=scrollY;setPlan(b.dataset.back,'plan');bumpTT();scrollTo(0,y);return}
  if(b=by('[data-set]')){if(b.dataset.set==='plan'&&CLS&&BYC[b.dataset.code]&&elig(BYC[b.dataset.code])==='no'&&!confirm(clsName(CLS)+' では対象外の授業です。それでも履修予定に入れますか?'))return;setPlan(b.dataset.code,b.dataset.set);const c=BYC[b.dataset.code];const box=$('#relbox');if(c&&box)box.outerHTML=planBoxHTML(c);return}
  if(b=by('#pimg')){try{ttImage(params().get('t')||defTerm())}catch(err){console.error(err);alert('画像を作れませんでした')}return}
  if(b=by('#patb')){const at=reqFor();if(at){at.codes.forEach(c=>{if(!PL.p[c])PL.p[c]='plan'});plSave();renderTT()}return}
  if(b=by('#pexp')){const blob=new Blob([JSON.stringify({v:1,cls:CLS,plan:PL},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='syllabus-plan.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}
  if(b=by('#pimp')){$('#pfile').click();return}
  if(b=by('#pclr')){if(confirm('履修プランを全部消しますか?(卒業要件の手入力は残ります)')){PL.p={};plSave();renderTT()}return}
  if(b=by('[data-co]')){const p=params();p.set('o',b.dataset.co);history.replaceState(null,'','#/w?'+p);renderCmp();return}
  if(b=by('[data-cmine]')){const p=params();p.get('mine')==='0'?p.delete('mine'):p.set('mine','0');history.replaceState(null,'','#/w?'+p);renderCmp();return}
  if(b=by('[data-md]')){const n=b.dataset.md,cur=mdStatus(n),nx=cur===''?'plan':cur==='plan'?'done':'-';PL.md[n]=nx;if(nx==='-'&&!DATA.some(x=>PL.p[x.c]&&nameKey(x.n)===nameKey(n)))delete PL.md[n];plSave();const y=scrollY,open=[...document.querySelectorAll('#view details')].map(d=>d.open);renderGrad();document.querySelectorAll('#view details').forEach((d,i)=>d.open=!!open[i]);scrollTo(0,y);return}
  if(b=by('[data-adj]')){const id=b.dataset.adj;PL.adj[id]=Math.max(0,(PL.adj[id]||0)+ +b.dataset.dv);plSave();const y=scrollY,open=[...document.querySelectorAll('#view details')].map(d=>d.open);renderGrad();document.querySelectorAll('#view details').forEach((d,i)=>d.open=!!open[i]);scrollTo(0,y);return}
});
$('#view').addEventListener('change',e=>{
  if(e.target.id==='course_select'){
    const p=params(); p.set('c', e.target.value);
    history.replaceState(null,'','#/g?'+p);
    renderGrad();
    return;
  }
  if(e.target.id==='pfile'){
    const f=e.target.files[0];if(!f)return;
    f.text().then(t=>{
      const o=JSON.parse(t),pl=o&&o.plan;
      if(!pl||typeof pl.p!=='object'||Array.isArray(pl.p))throw new Error('形式が違います');
      const n=Object.keys(pl.p).length;
      if(!confirm('読み込むと、いまの履修プランを置き換えます(読み込む内容: '+n+'科目)。よろしいですか?'))return;
      PL={p:pl.p||{},adj:pl.adj||{},md:pl.md||{}};plSave();
      if(typeof o.cls==='string'&&o.cls){CLS=o.cls;try{localStorage.setItem(CKEY,CLS)}catch(_){}}
      renderTT();
    }).catch(()=>alert('読み込めませんでした。書き出したファイル(JSON)を選んでください。'));
    e.target.value='';return;
  }
  if(e.target.id==='tcls'){CLS=e.target.value;try{localStorage.setItem(CKEY,CLS)}catch(_){}renderTT()}
});
function initFeatures(){
  BYC=Object.fromEntries(DATA.map(c=>[c.c,c]));
  buildSeries();
}

Promise.all([fetch('data/index.json',{cache:'no-cache'}).then(r=>r.json()),fetch('data/boilerplate.json').then(r=>r.ok?r.json():null).catch(()=>null),fetch('data/btable.json',{cache:'no-cache'}).then(r=>r.ok?r:fetch('btable.json',{cache:'no-cache'})).then(r=>r.ok?r.json():null).catch(()=>null),fetch('data/all_reqs.json').then(r=>r.ok?r.json():null).catch(()=>null),fetch('data/atable.json').then(r=>r.ok?r.json():null).catch(()=>null)]).then(([j,b,bt,md,at])=>{DATA=j;ALL_REQS=md;ATABLE=at;if(bt&&bt.rows){BT=bt.rows;BTV=bt.versions||{};DATA.forEach(c=>{c.b=BT[c.c]})}if(b){(b.labels||[]).forEach(l=>BOIL.labels.add(l));(b.pairs||[]).forEach(([k,x])=>BOIL.pairs.add(k+'\u0000'+x))}initFeatures();route()}).catch(err=>{console.error(err);$('#view').innerHTML='<p class="note">data/index.json を読み込めません。scrape.py を実行するか、ローカルサーバー経由で開いてください。</p>'});</script>
