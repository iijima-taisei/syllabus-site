<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="九州大学のシラバスをスマホで読みやすくした非公式の閲覧サイト。時間割・A表・卒業要件・科目比較。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f3efe6'/%3E%3Crect x='6' y='6' width='9' height='9' rx='1.5' fill='%23d4361e'/%3E%3Crect x='17' y='6' width='9' height='9' rx='1.5' fill='%2316140f'/%3E%3Crect x='6' y='17' width='9' height='9' rx='1.5' fill='%2316140f'/%3E%3Crect x='18' y='18' width='7' height='7' rx='1' fill='none' stroke='%2316140f' stroke-width='2'/%3E%3C/svg%3E">
<title>九大シラバス</title>
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f0e0b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ 九大シラバス — Design System ============
   方向性: 印刷物の時間割・学生便覧のような編集デザイン。紙の色 / 墨 / 朱 / 藍。
   見出しは明朝、本文はゴシック、数字と小さなラベルは等幅。罫線を主役にして装飾を足さない。 */
:root{
  --paper:#f3efe6;--paper-2:#ebe5d6;--surface:#fbf9f3;--ink:#16140f;--ink-2:#58554b;--ink-3:#6c6859;--on-accent:#fff;
  --rule:rgba(22,20,15,.14);--rule-2:rgba(22,20,15,.28);
  --accent:#d4361e;--accent-t:#b82a14;--accent-2:#f7dcd4;--indigo:#27348b;--indigo-2:#dde1f3;--moss:#2d6a4f;--moss-2:#d9eadf;--amber:#8a5000;--amber-2:#f7e3c0;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Noto Serif JP","Yu Mincho",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--ease-io:cubic-bezier(.65,0,.35,1);
  --r:14px;--hh:56px;--tb:64px;
  /* 既存のJSが参照する名前(互換) */
  --bg:var(--paper);--card:var(--surface);--sub:var(--ink-2);--line:var(--rule);--ac:var(--accent);--acbg:var(--paper-2);
  --ok:var(--moss);--okbg:var(--moss-2);--wn:var(--amber);--wnbg:var(--amber-2);--ng:#b3261e;--mute:var(--ink-3);
  --c0:var(--ink);--c1:var(--accent);--c2:var(--indigo);--c3:var(--moss);--c4:var(--ink-3);
  --ak-r:#f5e06d;--ak-m:#f1a65b;--ak-e:var(--surface);--ak-x:#cdc8ba;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root{
  --paper:#0f0e0b;--paper-2:#1a1814;--surface:#16140f;--ink:#efe9dc;--ink-2:#aaa597;--ink-3:#8f8b80;--on-accent:#1b0b07;
  --rule:rgba(239,233,220,.14);--rule-2:rgba(239,233,220,.3);
  --accent:#ff6a4d;--accent-t:#ff6a4d;--accent-2:#3b1d17;--indigo:#9fb0ff;--indigo-2:#1b2145;--moss:#78d1a4;--moss-2:#132b21;--amber:#f2b560;--amber-2:#35260f;--ng:#ff8a80;
  --ak-r:#6d6521;--ak-m:#7d5320;--ak-x:#3a3830;color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hh) + 12px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.7 var(--f-body);font-feature-settings:"palt";letter-spacing:.01em;
  word-break:auto-phrase;line-break:strict;text-wrap:pretty;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@media(prefers-color-scheme:dark){.nav{background:#2a2720}@media(min-width:900px){.nav{background:var(--paper-2)}}.nav a{color:rgba(239,233,220,.55)}.nav a.on{color:#efe9dc;background:rgba(239,233,220,.12)}}
::selection{background:var(--accent);color:var(--on-accent)}
a{color:inherit;text-decoration-color:var(--rule-2);text-underline-offset:.22em;text-decoration-thickness:1px}
a:hover{text-decoration-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3,h4{font-weight:700;margin:0;text-wrap:balance}
h2,h3{font-family:var(--f-disp);font-weight:800;letter-spacing:.005em}
.mono,.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.note{color:var(--ink-2)}

/* ---------- マストヘッド ---------- */
header{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);padding:calc(10px + env(safe-area-inset-top)) 20px 10px;transition:padding .3s var(--ease)}
h1{display:flex;align-items:center;gap:10px;font-size:1rem;min-height:36px}
h1 a{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}
.brand-mark{width:26px;height:26px;flex:none;align-self:center;display:grid;grid-template:repeat(2,1fr)/repeat(2,1fr);gap:2px}
.brand-mark i{background:var(--ink);border-radius:2px;transition:transform .5s var(--ease),background .3s}
.brand-mark i:nth-child(1){background:var(--accent)}
.brand-mark i:nth-child(4){background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
h1 a:hover .brand-mark i:nth-child(1){transform:translate(2px,2px)}
h1 a:hover .brand-mark i:nth-child(4){transform:translate(-2px,-2px)}
.brand-name{font-family:var(--f-disp);font-weight:800;font-size:1.28rem;letter-spacing:.02em}
.brand-en{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;display:none}
.ver{margin-left:auto;border:1px solid var(--rule);background:none;color:var(--ink-2);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.04em;padding:6px 12px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.ver:hover{background:var(--ink);color:var(--paper)}
#verinfo{position:absolute;right:20px;top:calc(100% + 8px);width:min(320px,calc(100vw - 40px));background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--r);padding:14px 16px;font-size:.84rem;line-height:1.7;box-shadow:0 18px 50px -12px rgba(0,0,0,.35);animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}

/* ---------- ナビ: モバイルは下タブ / デスクトップは上 ---------- */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--ink);border-radius:22px;padding:6px;
  box-shadow:0 14px 40px -10px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06) inset;max-width:520px;margin:0 auto}
.nav a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:color-mix(in srgb,var(--paper) 62%,transparent);text-decoration:none;font-size:.74rem;font-weight:700;letter-spacing:.04em;border-radius:16px;transition:color .25s,background .25s}
.nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease)}
.nav a.on{color:var(--paper);background:color-mix(in srgb,var(--paper) 14%,transparent)}
.nav a.on svg{transform:translateY(-1px) scale(1.08);stroke:var(--accent)}
.nav a:active{transform:scale(.96)}
main{padding:24px 20px calc(var(--tb) + 56px + env(safe-area-inset-bottom))}
@media(min-width:900px){
  .wrap{max-width:860px}
  h1{min-height:44px;margin-bottom:10px}.brand-en{display:inline}.ver{margin-left:auto;margin-right:456px}
  .nav{position:fixed;top:calc(10px + env(safe-area-inset-top));bottom:auto;left:auto;right:max(20px,calc((100vw - 860px)/2 + 20px));display:flex;gap:2px;max-width:none;margin:0;padding:3px;border-radius:999px;box-shadow:none;background:var(--paper-2);backdrop-filter:none;-webkit-backdrop-filter:none;z-index:25}
  .nav a{flex-direction:row;gap:8px;padding:8px 16px;font-size:.86rem;color:var(--ink-2);border-radius:999px}
  .nav a svg{width:17px;height:17px}.nav a.on{color:var(--paper);background:var(--ink)}.nav a.on svg{stroke:var(--accent)}
  .nav a:not(.on):hover{color:var(--ink)}
  main{padding-top:56px;padding-bottom:96px}
  .tt{gap:6px}.cell{min-height:104px;padding:7px 8px}.cc{font-size:.86rem}
}

/* ---------- 詳細画面の戻るバー ---------- */
#dbar{display:flex;align-items:center;gap:12px;min-height:44px}
#dbar button{flex:none;border:1px solid var(--rule-2);background:none;border-radius:999px;padding:6px 16px 6px 12px;font-size:.88rem;font-weight:700;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--ease)}
#dbar button:hover{background:var(--ink);color:var(--paper)}#dbar button:active{transform:scale(.95)}
#dbar span{font-family:var(--f-disp);font-weight:800;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ---------- フォーム部品 ---------- */
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule-2);border-radius:12px;padding:11px 14px;min-width:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%23888' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center;text-overflow:ellipsis}
.srch{display:flex;gap:8px;align-items:stretch}
.fbtn{position:relative;flex:none;width:52px;border:1px solid var(--rule-2);background:var(--surface);border-radius:14px;display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s,transform .25s var(--ease)}
.fbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}.fbtn:hover,.fbtn[aria-expanded=true]{background:var(--ink);color:var(--paper)}.fbtn:active{transform:scale(.94)}
.fbtn b{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:.68rem;display:grid;place-items:center;padding:0 5px}
#flt{animation:rise .4s var(--ease)}
#flt>.row:has(select){display:grid;grid-template-columns:1fr 1fr;gap:8px}
#flt>.row:has(select) select{width:100%;flex:none}
#flt #cls,#flt #place{grid-column:1/-1}
#q{flex:1;width:auto;font-size:1.02rem;padding:14px 16px 14px 46px;border-radius:14px;background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") no-repeat 16px center}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.row select{flex:1 1 30%}
#tcls{flex:1 1 100%;order:5}
#sems,#days{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
#sems::-webkit-scrollbar,#days::-webkit-scrollbar{display:none}
#sems .chip,#days .chip{flex:none}
#sems{flex-wrap:nowrap;margin-inline:0;padding-inline:0;overflow:visible;gap:6px}#sems .chip{flex:1 1 0;padding-inline:0;min-width:0}
.chip{min-height:44px;border:1px solid var(--rule-2);background:transparent;color:var(--ink);border-radius:999px;padding:5px 16px;font-size:.88rem;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  transition:background .2s var(--ease),color .2s,border-color .2s,transform .25s var(--ease)}
.chip:hover{border-color:var(--ink)}.chip:active{transform:scale(.95)}
.chip[aria-pressed=true],.chip.st.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.add{background:var(--ink);color:var(--paper);border-color:var(--ink);min-height:36px;padding-inline:14px;font-weight:700}
.chip.add:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lnk{border:0;background:none;color:var(--ink);font-size:.86rem;font-weight:700;min-height:44px;padding:0 0 0 14px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:.3em}
.count .lnk{min-height:0;padding:0 0 0 10px}
.hint{margin:14px 0;padding:14px 16px;border-radius:var(--r);background:var(--accent-2);color:var(--ink);font-size:.9rem;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.srcnote{margin:10px 0 0;font-size:.8rem;color:var(--ink-3);line-height:1.6}
.count{color:var(--ink-2);font-size:.86rem;margin:6px 0 14px;font-family:var(--f-body)}
.count b{font-family:var(--f-mono);font-weight:600}
#ctl .srcnote{margin:8px 0 0}
#ctlbar{padding:6px 0}
#ctl.cc{display:none}

/* ---------- ページ見出し ---------- */
h2.lh,.sechead h2{font-size:clamp(1.9rem,6.6vw,2.7rem);line-height:1.15;letter-spacing:.01em;margin:0 0 6px;font-weight:800}
h2.lh small{display:block;font-family:var(--f-body);font-size:.82rem;font-weight:500;color:var(--ink-2);letter-spacing:.02em;margin-top:6px}
h2.lh[data-e]::before{content:attr(data-e);display:block;font-family:var(--f-mono);font-weight:400;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-t);margin-bottom:10px}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;color:var(--ink);font-size:.86rem;font-weight:700;text-decoration:none;font-family:var(--f-mono);letter-spacing:.04em}
.back:hover{color:var(--accent-t)}

/* ---------- 一覧 ---------- */
.item{display:block;position:relative;padding:20px 0 18px;border-bottom:1px solid var(--rule);color:inherit;text-decoration:none;transition:padding .35s var(--ease),background .25s}
.item::before{content:"";position:absolute;left:-20px;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transform-origin:top;transition:transform .35s var(--ease)}
.item:hover,.item:active{padding-left:10px}.item:hover::before,.item:active::before{transform:scaleY(1)}
.item b{display:block;font-family:var(--f-disp);font-weight:800;font-size:1.18rem;line-height:1.45;letter-spacing:.01em}
.meta{display:block;margin:4px 0 10px;color:var(--ink-2);font-size:.83rem;line-height:1.6}
.tag{display:inline-flex;align-items:center;border:1px solid var(--rule-2);color:var(--ink-2);border-radius:999px;padding:2px 11px;font-size:.78rem;font-weight:500;margin:0 5px 5px 0;line-height:1.7;letter-spacing:.02em}
.tag.s{background:var(--ink);border-color:var(--ink);color:var(--paper);font-family:var(--f-mono);font-weight:600;font-size:.76rem}
.tag.w{background:var(--amber-2);border-color:transparent;color:var(--amber)}
.tag.no{border-color:var(--ng);color:var(--ng)}
.more{width:100%;margin-top:18px;padding:14px;border:1px solid var(--rule-2);background:none;border-radius:999px;font-weight:700;cursor:pointer;transition:background .2s,color .2s}
.more:hover{background:var(--ink);color:var(--paper)}
.sechead{display:flex;align-items:center;justify-content:space-between}
.hist{margin:0 0 28px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.hist summary{cursor:pointer;font-family:var(--f-mono);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;padding:14px 0;color:var(--ink-2);list-style:none;display:flex;gap:10px;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.hist summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid var(--rule-2);border-radius:50%;font-size:.8rem;line-height:1;transition:transform .3s var(--ease)}
.hist[open] summary::before{transform:rotate(45deg)}
.hist summary small{margin-left:auto;font-weight:400}
.hist .item:last-child{border-bottom:0}

/* ---------- 詳細 ---------- */
.hero{padding:6px 0 4px}
.hero h2{font-size:clamp(2.1rem,8.4vw,3.4rem);line-height:1.22;font-weight:800;letter-spacing:.01em;margin:0 0 10px}
.facts{display:grid;grid-template-columns:1.3fr .8fr 1fr;margin:0 0 16px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.facts>div{padding:12px 0 12px 14px;border-left:1px solid var(--rule);min-width:0}.facts>div:first-child{padding-left:0;border-left:0}
.facts dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0}
.facts dd{margin:2px 0 0;font-family:var(--f-disp);font-weight:800;font-size:1.7rem;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
.facts dd small{font-family:var(--f-body);font-weight:500;font-size:.78rem;color:var(--ink-2);margin-left:2px}.facts .sl{color:var(--rule-2);font-weight:400;margin:0 5px}
.hero .teacher{color:var(--ink-2);margin:0 0 16px;font-size:.98rem}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1px solid var(--rule-2);color:var(--ink);border-radius:999px;padding:3px 13px;font-size:.8rem;font-weight:500}
.pill.strong{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.src{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px 0 6px;min-height:52px;border:1px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:700;font-size:.92rem;transition:background .25s,color .25s,transform .25s var(--ease)}
.src:hover{background:var(--ink);color:var(--paper)}.src:active{transform:scale(.98)}
.src.top{margin:20px 0 0}
.tabs{position:sticky;top:var(--hh);z-index:6;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;background:var(--paper);border-bottom:1px solid var(--rule);margin:22px -20px 0;padding:0 20px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--ink-3);padding:14px 2px 12px;margin-right:24px;font-weight:700;font-size:.9rem;border-bottom:3px solid transparent;transition:color .25s,border-color .25s}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.card{padding:32px 0 10px;scroll-margin-top:calc(var(--hh) + 56px)}
.card>h3{font-size:1.5rem;margin:0 0 14px;line-height:1.3}
.card>h3::before{content:"";display:inline-block;width:.5em;height:.5em;background:var(--accent);margin-right:.5em;vertical-align:.12em;border-radius:1px}
.cond{padding:28px 0 6px;border-top:1px solid var(--ink);margin-top:26px}
.cond h3{font-size:1.5rem;margin:0 0 10px}
.verdict{margin:0 0 8px;font-size:1.05rem}.verdict .ok{color:var(--moss)}.verdict .ng{color:var(--ng)}
.rows{margin:0}.rows>div{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.rows dt{width:88px;flex:none;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;color:var(--ink-3);margin:0;padding-top:4px}
.rows dd{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
dt{font-size:.8rem;color:var(--ink-2);margin-top:.7em}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:0}.grid div{min-width:0}
.grid dt,.f dt{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;color:var(--ink-3);margin:0}
.grid dd{margin:0;font-weight:700;white-space:normal}
.f{margin:0 0 18px}.f:last-child{margin-bottom:0}.f dd{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.tags span,.tags a{border:1px solid var(--rule-2);border-radius:999px;padding:2px 12px;font-size:.84rem;text-decoration:none;color:var(--ink)}

/* ---------- 時間割 ---------- */
.tt{scroll-margin-top:calc(var(--hh) + 8px);display:grid;grid-template-columns:40px repeat(5,minmax(0,1fr));gap:4px;margin:14px 0 8px}

.cell{min-height:92px;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:5px 5px 4px;display:flex;flex-direction:column;gap:3px;font:inherit;color:inherit;cursor:pointer;text-align:left;overflow:hidden;position:relative;transition:transform .3s var(--ease),border-color .2s,background .2s,box-shadow .3s}

.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--ink);transform:translateX(calc(var(--i,0)*100%));transition:transform .45s var(--ease)}
.ltools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 10px}.ltools .count{margin:0}

.reqbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 4px;padding:12px 14px 12px 18px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:.9rem;cursor:pointer;text-align:left;transition:transform .25s var(--ease),filter .2s}
.reqbar b{font-weight:700}.reqbar i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.14);font-size:1.1rem;flex:none}
.reqbar:hover{filter:brightness(1.06)}.reqbar:active{transform:scale(.98)}
.reqdone{margin:10px 0 2px;font-size:.84rem;color:var(--ink-2)}
.tline{margin:6px 0 8px}.chip.sm{min-height:40px;padding:2px 14px;font-size:.8rem}
.tfoot{margin-top:6px}.tfoot .tlg{margin:6px 0 4px}.tfoot .count{margin:0;font-size:.82rem;color:var(--ink-3)}
.sg{background:var(--surface);border-color:var(--rule-2)}.sg.rq{background:var(--accent-2);border-color:var(--accent)}.sg.el{background:var(--indigo-2);border-color:var(--indigo)}.sg.bad{background:repeating-linear-gradient(135deg,var(--amber-2) 0 3px,transparent 3px 6px);border-color:var(--ng)}
details.manual{margin:12px 0;border-top:1px solid var(--rule)}details.manual summary{font-weight:500;font-size:.86rem;color:var(--ink-2);padding:12px 0}details.manual summary b{font-family:var(--f-mono);margin-left:4px;color:var(--accent-t)}
details.manual ul{margin:0;padding-left:1.2em;font-size:.86rem;line-height:1.8;color:var(--ink-2)}

/* ---------- 科目比較 ---------- */
.cmp{padding:18px 0;border-bottom:1px solid var(--rule)}
.cmph{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.cmph a{color:inherit;text-decoration:none;font-family:var(--f-disp);font-weight:800;font-size:1.15rem}
.cmph .cpb{margin-left:auto}
.cmp .stack{margin-top:10px}

/* ---------- 卒業要件 ---------- */
.gsec{margin:0 0 34px}.gsec.total{margin-top:30px}.gsec>h3{font-size:1.6rem;margin:26px 0 8px;border:0}.gsec>h3 small{font-family:var(--f-mono);font-weight:400;color:var(--ink-3);font-size:.72rem;letter-spacing:.06em}
.total{border-top:1px solid var(--ink);padding-top:6px}
.total .big{font-family:var(--f-disp);font-size:clamp(3.6rem,17vw,6rem);font-weight:800;line-height:1;letter-spacing:-.01em;margin:6px 0 4px}
.total .big{display:flex;align-items:baseline;gap:10px}.total .big .of{font-family:var(--f-mono);font-size:1.1rem;font-weight:400;color:var(--ink-3);letter-spacing:0}
.bigsub{margin:0 0 14px;color:var(--ink-2);font-size:.9rem}.bigsub b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.total .gbar{height:12px;border-radius:6px}.total .eyebrow{margin:14px 0 0}
.grow{padding:16px 0 14px;border-bottom:1px solid var(--rule)}
.gh{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.gh b{font-weight:700}.gn2{font-family:var(--f-mono);font-weight:600;font-size:.88rem;white-space:nowrap}
.gbar{height:6px;background:var(--paper-2);overflow:hidden;margin:10px 0 6px;border-radius:3px}
.gbar i{display:block;height:100%;float:left;transform-origin:left;animation:grow 1.1s var(--ease) both}
.gbar .d{background:var(--ink)}.gbar .p{background:var(--accent);opacity:.8}
.stp{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:.84rem}
.stp button{border:1px solid var(--rule-2);background:none;border-radius:50%;width:44px;height:44px;font-size:1.1rem;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--ease)}
.stp button:hover{background:var(--ink);color:var(--paper)}.stp button:active{transform:scale(.9)}
.stp b{padding:0 6px;font-weight:500}

/* ---------- フッター ---------- */
.sitefoot{max-width:820px;margin:0 auto;padding:36px 20px calc(var(--tb) + 56px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);color:var(--ink-3);font-size:.8rem;line-height:1.8}
@media(min-width:900px){.sitefoot{padding-bottom:64px}}

/* ---------- 細部 ---------- */
mark{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--accent) 38%,transparent) 58%);color:inherit;padding:0 1px}

.item .cd{position:absolute;right:0;top:20px;font-family:var(--f-mono);font-style:normal;font-size:.72rem;letter-spacing:.08em;color:var(--ink-3)}
.item b{padding-right:74px}
.empty{padding:56px 0;text-align:center}.empty .eg{font-family:var(--f-disp);font-size:4.4rem;line-height:1;color:var(--rule-2);margin-bottom:10px}.empty p{margin:4px 0}

  body::after{content:"KYUSHU UNIVERSITY  ·  SYLLABUS 2026  ·  UNOFFICIAL";position:fixed;left:28px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg);font-family:var(--f-mono);font-size:.62rem;letter-spacing:.34em;color:var(--ink-3);pointer-events:none;white-space:nowrap}
}
/* ---------- 動き ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--paper);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none}
#splash.go{display:flex;animation:sp-out .8s var(--ease-io) 1.35s forwards}
.sp-mark{width:56px;height:56px;display:grid;grid-template:repeat(2,1fr)/repeat(2,1fr);gap:5px}
.sp-mark i{background:var(--ink);border-radius:4px;animation:sp-in .7s var(--ease) both}
.sp-mark i:nth-child(1){background:var(--accent)}.sp-mark i:nth-child(2){animation-delay:.08s}.sp-mark i:nth-child(3){animation-delay:.16s}
.sp-mark i:nth-child(4){background:transparent;box-shadow:inset 0 0 0 2.5px var(--ink);animation-delay:.24s}
.sp-name{overflow:hidden}.sp-name span{display:block;font-family:var(--f-disp);font-weight:800;font-size:2rem;letter-spacing:.04em;animation:sp-text .8s var(--ease) .35s both}
.sp-en{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);animation:rise .8s var(--ease) .7s both}
@keyframes sp-in{from{transform:scale(0) rotate(-40deg);opacity:0}}
@keyframes sp-text{from{transform:translateY(110%)}}
@keyframes sp-out{to{transform:translateY(-100%);visibility:hidden}}
@supports(animation-timeline:scroll()){
  .hero h2{animation:hero-shrink linear both;animation-timeline:scroll(root);animation-range:0 320px;transform-origin:left top}
  @keyframes hero-shrink{to{opacity:.25;transform:scale(.9) translateY(-6px)}}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
#view>*{animation:rise .6s var(--ease) both}
#view>*:nth-child(2){animation-delay:.05s}#view>*:nth-child(3){animation-delay:.1s}#view>*:nth-child(4){animation-delay:.15s}
.item:nth-child(-n+10){animation:rise .6s var(--ease) both}
.item:nth-child(2){animation-delay:.04s}.item:nth-child(3){animation-delay:.08s}.item:nth-child(4){animation-delay:.12s}.item:nth-child(5){animation-delay:.16s}.item:nth-child(6){animation-delay:.2s}.item:nth-child(7){animation-delay:.24s}.item:nth-child(8){animation-delay:.28s}
.skel{height:76px;margin:14px 0;border-radius:var(--r);background:linear-gradient(100deg,var(--paper-2) 30%,color-mix(in srgb,var(--paper-2) 50%,var(--surface)) 50%,var(--paper-2) 70%) 0 0/300% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-300% 0}}
::view-transition-old(root){animation:vt-out .22s var(--ease-io) both}::view-transition-new(root){animation:vt-in .42s var(--ease) both}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>

<footer class="sitefoot">非公式の閲覧サイトです。九州大学とは関係ありません。出典: Campusmate(九大シラバス)・履修資料(B表・学生便覧)。内容は正確とは限らないため、履修の判断は必ず公式の情報で確認してください。最終更新: 2026年10月1日</footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zen=s=>s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
const DAYS=['月','火','水','木','金'];
const SEMS=['前期','後期','春','夏','秋','冬'];
const BASESEM=new Set(['前期','後期','春学期','夏学期','秋学期','冬学期']);
// トップに出す授業(学部カテゴリ)。他学部は「すべての学部を表示」で見られる
const SCOPE=/基幹教育|芸術工/;
// クラス記号(A表より)。value = B表の担当クラスと同じ書き方
const CLASSDEF=[['共創学部',[['I1-1',''],['I1-2',''],['I1-3','']]],
 ['文学部',[['L1-1',''],['L1-2',''],['L1-3',''],['L1-4','']]],['教育学部',[['L1-5','']]],['法学部',[['L1-6',''],['L1-7',''],['L1-8',''],['L1-9','']]],
 ['経済学部',[['L1-10','経済・経営'],['L1-11','経済・経営'],['L1-12','経済・経営'],['L1-13','経済工学'],['L1-14','経済工学']]],
 ['理学部',[['S1-1','物理'],['S1-2','化学'],['S1-3','地球惑星科学'],['S1-4','数学'],['S1-5','生物']]],
 ['医学部',[['S1-6','医学科'],['S1-7','医学科・生命科学科'],['S1-8','保健(看護)'],['S1-9','保健(放射線)'],['S1-10','保健(検査)']]],
 ['歯学部',[['S1-11','']]],['薬学部',[['S1-12','創薬科学'],['S1-13','臨床薬学']]],
 ['工学部',[['S1-14','Ⅰ群'],['S1-15','Ⅰ群'],['S1-16','Ⅱ群'],['S1-17','Ⅱ群'],['S1-18','Ⅱ群'],['S1-19','Ⅲ群'],['S1-20','Ⅲ群'],['S1-21','Ⅲ群'],['S1-22','Ⅳ群'],['S1-23','Ⅳ群'],['S1-24','Ⅴ群(建築)'],['S1-25','Ⅵ群'],['S1-26','Ⅵ群'],['S1-27','Ⅵ群']]],
 ['芸術工学部',[['S1-28','環境設計'],['S1-29','インダストリアルデザイン'],['S1-30','未来構想デザイン'],['S1-31','メディアデザイン'],['S1-32','音響設計'],['S1-33','学科一括']]],
 ['農学部',[['S1-34',''],['S1-35',''],['S1-36',''],['S1-37','']]],
 ['芸術工学部 2〜4年',[28,29,30,31,32].flatMap(k=>[2,3,4].map(y=>['D'+k+'-'+y,'']))]];
const ARTC={28:'環境設計',29:'インダストリアルデザイン',30:'未来構想デザイン',31:'メディアデザイン',32:'音響設計'};
const clsName=v=>{const m=/^D(\d\d)-(\d)$/.exec(v||'');return m?ARTC[m[1]]+' '+m[2]+'年':v};
const upM=()=>/^D(\d\d)-(\d)$/.exec(CLS||'');
const CKEY='kyudai-syllabus-class';
let CLS=(()=>{try{return localStorage.getItem(CKEY)||''}catch(e){return ''}})();
let BT=null,BTV={};
// クラスが設定されていれば、既定で「受講可のみ」。?mine=0 で解除
const mineOn=()=>!!CLS&&params().get('mine')!=='0';
// 受講可否: yes / no / intl(留学生向け) / unk(B表の対象外の科目) / nodata(基幹教育なのにB表に無い=1年生用ではない)
function elig(c){
  const b=c.b,um=upM();
  if(um){   // 芸術工学部 2〜4年: 芸工の科目は「対象コース・学年」、基幹教育はB表の全学年・高年次だけ
    const y=+um[2];
    if(c.cx)return c.cx[um[1]]&&(!c.yr.length||c.yr.includes(y))?'yes':'no';
    if(b){if(b.fl.includes('ALL'))return /・日本語】/.test(b.cat)?'intl':'yes';return b.fl.includes('HIGH')&&y>=3?'yes':'no'}
    return /基幹教育/.test(c.cat||'')?'nodata':'unk';
  }
  const sm=/^S1-(\d\d)$/.exec(CLS||'');
  if(c.cx&&sm&&+sm[1]>=28&&+sm[1]<=33)return (sm[1]==='33'?Object.keys(c.cx).length:c.cx[sm[1]])&&(!c.yr.length||c.yr.includes(1))?'yes':'no';
  if(!b)return /基幹教育/.test(c.cat||'')?'nodata':'unk';
  if(b.cs.includes(CLS))return 'yes';
  if(b.fl.includes('ALL'))return /・日本語】/.test(b.cat)?'intl':'yes';
  return 'no';
}
const placeOf=c=>{const b=c.b;
  if(!b){const x=c.campus||'';return /大橋|馬出/.test(x)?'大橋':/病院/.test(x)?'病院':/伊都/.test(x)?'伊都':''}
  if(/大橋/.test(b.campus))return '大橋';
  if(/遠隔/.test(b.room)||/遠隔/.test(b.campus))return '遠隔';
  if(/イースト/.test(b.campus))return '伊都(イースト)';if(/病院/.test(b.campus))return '病院';
  return /センター/.test(b.campus)?'伊都(センター)':'その他'};
const APPLY={'○':['事前申請','Moodleから事前申請が必要。抽選で受講者が決まります'],'●':['要登録・抽選','Campusmate-Jで履修登録。登録者数により抽選の可能性があります'],'※':['申請・抽選あり','シラバス等の案内に従って申し込みます'],'※●':['申請・抽選あり','シラバス等の案内に従って申し込みます']};
function badgeHTML(c){
  const b=c.b;if(!b)return '';let h='';
  const ap=b.apply&&(APPLY[b.apply]||['申請あり','']);
  if(ap)h+=` <span class="tag w" title="${esc(ap[1])}">${esc(ap[0])}</span>`;
  if(placeOf(c)==='遠隔')h+=' <span class="tag w">遠隔</span>';
  if(/→/.test(b.room))h+=` <span class="tag w">教室変更 ${esc(b.room)}</span>`;
  if(/履修登録不可/.test(b.note))h+=' <span class="tag w">別途申請</span>';
  if(CLS&&c.cx){const k=(upM()||/^S1-(\d\d)$/.exec(CLS)||[])[1],r=k&&c.cx[k];if(r==='h')h+=' <span class="tag w">必修</span>';else if(r==='s')h+=' <span class="tag w">選択必修</span>'}
  if(CLS){const e=elig(c);if(e==='no')h+=' <span class="tag no">対象外</span>';if(e==='intl')h+=' <span class="tag w">留学生向け</span>'}
  return h;
}
function condHTML(c){
  const b=c.b;if(!b)return '';
  const e=CLS?elig(c):'';
  const verdict=e==='yes'?`<b class="ok">${esc(clsName(CLS))} は受講できます</b>`:e==='no'?`<b class="ng">${esc(clsName(CLS))} は対象外です</b>`:e==='intl'?'<b>留学生向けの科目です</b>':'';
  const ap=b.apply?(APPLY[b.apply]||['申請あり',''])[1]:'不要';
  const rows=[['対象クラス',b.fl.includes('ALL')?'全学年':b.cls],['教室',[b.campus,b.room].filter(Boolean).join('　')],['事前申請',ap],['備考',b.note]].filter(r=>r[1]);
  return `<section class="cond"><h3>受講条件</h3>${verdict?`<p class="verdict">${verdict}</p>`:''}<dl class="rows">${rows.map(([k,x])=>`<div><dt>${esc(k)}</dt><dd>${esc(x)}</dd></div>`).join('')}</dl><p class="srcnote">B表(${esc(b.term)}期 ${esc(BTV[b.term]||'')}版)より</p></section>`;
}
const subOf=c=>c.b?c.b.cat:(c.kbn||'');
/* 科目区分を整理: B表の区分とCampusmateの区分(日英併記・表記ゆれ)を、グループ→項目の2段にそろえる */
const SUB_G=['セミナー・課題発見・アプローチ','言語文化','文系ディシプリン','理系ディシプリン','総合科目','健康・スポーツ','サイバーセキュリティ','高年次基幹教育','芸術工学部'];
const SUB_I={'言語文化':['英語','ドイツ語','フランス語','中国語','ロシア語','スペイン語','韓国語','日本語','多文化入門講義','その他の言語文化'],
  '文系ディシプリン':['人文系','社会系','心理系','教育系','法学系','経済系','一般系'],'理系ディシプリン':['数学','物理','化学','生物','地球科学','情報','感性','実験','複合系'],
  '芸術工学部':['デザインリテラシー科目','コース基礎科目','コース専門科目','コース演習科目 (PBL)','融合プロジェクト・プラットフォーム','卒業研究・設計','専攻教育科目']};
const SUB_EN={'Subjects in Science':'理系ディシプリン科目','Subjects in Humanities and Social Science':'文系ディシプリン科目','Cybersecurity':'サイバーセキュリティ科目','Subject for Health and Sports Science':'健康・スポーツ科目'};
function subKey(c){
  if(c._sk)return c._sk;
  let t=String(c.b?c.b.cat:(c.kbn||'')).replace(/[\u3000\s]+/g,' ').trim();
  t=SUB_EN[t]||t.split(/ (?=[A-Za-z])/)[0].replace(/[：:].*$/,'').trim();
  let g,i,m;
  if(c.cat==='芸術工学部'){g='芸術工学部';i=t||'専攻教育科目'}
  else if(c.cat!=='基幹教育科目'){g=c.cat||'その他';i=t||'その他'}
  else if(/^(基幹教育セミナー|課題発見科目|学術アプローチ科目)/.test(t)){g='セミナー・課題発見・アプローチ';i=t.replace(/科目$/,'')}
  else if(/言語文化/.test(t)){g='言語文化';i=(m=t.match(/言語文化・([^】]+)/))?m[1]:'その他の言語文化'}
  else if(/文D|文系ディシプリン/.test(t)){g='文系ディシプリン';i=(m=t.match(/文D・([^】]+)/))?m[1]:'その他'}
  else if(/理D|理系ディシプリン/.test(t)){g='理系ディシプリン';i=(m=t.match(/理D・([^】]+)】/))?m[1]:'その他'}
  else if(/総合/.test(t)){g='総合科目';i=/フロンティア/.test(t)?'フロンティア科目':'オープン科目'}
  else if(/健スポ|健康・スポーツ/.test(t)){g='健康・スポーツ';i=/実習/.test(t)?'実習':/講義/.test(t)?'講義':'その他'}
  else if(/サイバー|Cyber/.test(t)){g='サイバーセキュリティ';i='サイバーセキュリティ'}
  else if(/高年次/.test(t)){g='高年次基幹教育';i='高年次基幹教育'}
  else{g='その他';i=t||'その他'}
  return c._sk={g,i};
}
const subMatch=(c,sub)=>{const k=subKey(c),[g,i]=sub.split('|');return k.g===g&&(!i||k.i===i)};
function subOptions(cat,cur){
  const m=new Map();
  pool().filter(c=>!cat||c.cat===cat).forEach(c=>{const k=subKey(c);if(!m.has(k.g))m.set(k.g,new Map());const mi=m.get(k.g);mi.set(k.i,(mi.get(k.i)||0)+1)});
  const gs=[...m.keys()].sort((a,b)=>{const x=SUB_G.indexOf(a),y=SUB_G.indexOf(b);return (x<0?99:x)-(y<0?99:y)||a.localeCompare(b,'ja')});
  const h=gs.map(g=>{
    const mi=m.get(g),tot=[...mi.values()].reduce((a,b)=>a+b,0),order=SUB_I[g]||[];
    const its=[...mi.keys()].sort((a,b)=>{const x=order.indexOf(a),y=order.indexOf(b);return (x<0?99:x)-(y<0?99:y)||mi.get(b)-mi.get(a)});
    const one=its.length===1&&its[0]===g;
    const v=g+'|';
    return `<optgroup label="${esc(g)}">${one?'':`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(g)}すべて (${tot})</option>`}${its.map(i=>{const val=g+'|'+i;return `<option value="${esc(val)}"${val===cur?' selected':''}>${esc(one?g:i)} (${mi.get(i)})</option>`}).join('')}</optgroup>`}).join('');
  return '<option value="">科目区分</option>'+h;
}
const pool=()=>params().get('all')?DATA:DATA.filter(c=>SCOPE.test(c.cat||''));
let DATA=[],shown=100,listScroll=0;
const params=()=>new URLSearchParams(location.hash.split('?')[1]||'');
const slots=c=>c.when.map(w=>{const d=w.match(/([月火水木金土日])曜日/),p=zen(w).match(/(\d)時限/);return{sem:w.split(/[\s\u3000]+/)[0],d:d&&d[1],p:p&&p[1]}});

function setP(k,v){const p=params();v?p.set(k,v):p.delete(k);if(k==='cat')p.delete('sub');history.replaceState(null,'','#/?'+p);shown=100;syncCtl();renderList()}
function opts(id,label,vals,cur){$(id).innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option${v===cur?' selected':''}>${esc(v)}</option>`).join('')}
function uniq(f){return [...new Set(pool().flatMap(f).filter(Boolean))].sort()}
function syncCtl(){
  const p=params();$('#q').value!==(p.get('q')||'')&&($('#q').value=p.get('q')||'');
  opts('#sem','集中など',uniq(c=>slots(c).map(s=>s.sem)).filter(x=>!BASESEM.has(x)),p.get('sem'));
  $('#sems').innerHTML=SEMS.map(x=>`<button class="chip" aria-pressed="${p.get('sem')===x}" data-s="${x}">${x}</button>`).join('');
  opts('#cat','区分',uniq(c=>[c.cat]),p.get('cat'));
  $('#sub').innerHTML=subOptions(p.get('cat'),p.get('sub'));
  opts('#per','時限',['1','2','3','4','5','6'].map(x=>x),p.get('per'));
  $('#myrow').hidden=$('#myrow2').hidden=false;
  const nocat=!DATA.some(c=>c.cat);
  $('#btnote').hidden=!!BT&&!nocat;
  $('#btnote').textContent=nocat?'⚠ index.json に学部カテゴリがありません(絞り込みが空になります)。python3 scrape.py --enrich を実行してください。':(BT?'':'⚠ B表データ(btable.json)が読み込めません。data フォルダに置いて、Cmd+Shift+R で再読み込みしてください。');
  $('#btver').textContent=BT?'B表: '+Object.entries(BTV).map(([k,x])=>`${k} ${String(x).replace(/^\d{4}\//,'')}版`).join(' / '):'';
  if(BT){
    $('#cls').innerHTML='<option value="">クラス未設定</option>'+CLASSDEF.map(([g,a])=>`<optgroup label="${g}">${a.map(([v,l])=>`<option value="${v}"${v===CLS?' selected':''}>${/^D/.test(v)?clsName(v):v+(l?' '+esc(l):'')}</option>`).join('')}</optgroup>`).join('');
    opts('#place','場所',['大橋','伊都','伊都(センター)','伊都(イースト)','病院','遠隔'],p.get('place'));
    $('#mine').setAttribute('aria-pressed',String(mineOn()));$('#nolot').setAttribute('aria-pressed',String(!!p.get('nolot')));
  }
  $('#days').innerHTML=DAYS.map(d=>`<button class="chip" aria-pressed="${p.get('d')===d}" data-d="${d}">${d}</button>`).join('');
  const na=['cat','sub','per','place','d','nolot'].filter(k=>p.get(k)).length+(p.get('sem')&&!SEMS.includes(p.get('sem'))?1:0);
  $('#fltn').hidden=!na;$('#fltn').textContent=na;
}
$('#fltt').addEventListener('click',()=>{const f=$('#flt'),o=f.hidden;f.hidden=!o;$('#fltt').setAttribute('aria-expanded',o);measureHead()});
function filtered(){
  const p=params(),q=(p.get('q')||'').toLowerCase().split(/[\s\u3000]+/).filter(Boolean);
  const sem=p.get('sem'),cat=p.get('cat'),sub=p.get('sub'),d=p.get('d'),per=p.get('per');
  return pool().filter(c=>{
    if(cat&&c.cat!==cat)return false;
    if(sub&&sub.includes('|')&&!subMatch(c,sub))return false;
    const hay=(c.n+c.t+(c.kw||'')+c.c+(c.cat||'')).toLowerCase();
    if(!q.every(t=>hay.includes(t)))return false;
    if(mineOn()){const e=elig(c);if(e!=='yes'&&e!=='unk')return false}
    if(p.get('nolot')&&c.b&&c.b.apply)return false;
    if(p.get('place')){const pl=placeOf(c),w=p.get('place');if(!(pl===w||(w==='伊都'&&pl.startsWith('伊都'))))return false}
    if(sem||d||per)return slots(c).some(s=>(!sem||s.sem.startsWith(sem))&&(!d||s.d===d)&&(!per||s.p===per));
    return true;
  });
}
const HKEY='kyudai-syllabus-history';
let histOpen=false;
function histGet(){try{const a=JSON.parse(localStorage.getItem(HKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function histAdd(code){try{localStorage.setItem(HKEY,JSON.stringify([code,...histGet().filter(x=>x!==code)].slice(0,30)))}catch(e){}}
function histClear(){try{localStorage.removeItem(HKEY)}catch(e){}}
let histAll=false;
const hl=t=>{
  const q=(params().get('q')||'').trim();if(!q)return esc(t);
  const ks=[...new Set(q.split(/[\s\u3000]+/).filter(Boolean))].map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!ks.length)return esc(t);
  return String(t).split(new RegExp('('+ks.join('|')+')','gi')).map((x,i)=>i%2?`<mark>${esc(x)}</mark>`:esc(x)).join('');
};
const itemHTML=c=>`<a class="item" href="#/c/${esc(c.c)}"><i class="cd">${esc(c.c)}</i><b>${hl(c.n)}</b><span class="meta">${hl(c.t)}　${c.when.map(w=>esc(w.replace(/[\s\u3000]+/g,' '))).join(' / ')}</span><div>${c.credit?`<span class="tag s">${esc(c.credit)}単位</span> `:''}${c.cat?`<span class="tag">${esc(c.cat)}</span> `:''}${c.lang?`<span class="tag">${esc(c.lang)}</span>`:''}${badgeHTML(c)}${PL.p[c.c]?` <span class="tag s">${PL.p[c.c]==='done'?'修得済み':'履修予定'}</span>`:''}</div></a>`;
function renderList(){
  const r=filtered(),v=$('#view'),p=params();
  $('#ctl').hidden=false;
  const active=['q','sem','cat','sub','d','per'].some(k=>p.get(k));
  const byCode=Object.fromEntries(DATA.map(c=>[c.c,c]));
  const hist=histGet().map(x=>byCode[x]).filter(Boolean);
  let h='';
  if(!active&&hist.length){
    h+=`<details class="hist"${histOpen?' open':''}><summary>最近見た講義 <small>${hist.length}件</small></summary><div class="sechead"><span></span><button class="lnk" id="hclear" type="button">履歴を消す</button></div>${hist.slice(0,histAll?30:5).map(itemHTML).join('')}${hist.length>5&&!histAll?'<button class="lnk" id="hmore" type="button">もっと見る</button>':''}</details>`;
  }
  h+=`<section><h2 class="lh" data-e="Courses">講義を探す</h2><div class="ltools"><p class="count"><b>${r.length}</b> 件</p><div class="seg sm" role="group" aria-label="表示する学部" style="--i:${p.get('all')?1:0}"><button type="button" id="scope0" aria-pressed="${!p.get('all')}">基幹教育・芸工</button><button type="button" id="scope1" aria-pressed="${!!p.get('all')}">全学部</button></div></div>${active||p.get('place')||p.get('nolot')?'<button class="lnk fclr" id="fclear" type="button">条件をクリア ×</button>':''}${mineOn()?`<p class="count"><b>${esc(clsName(CLS))}</b> で受講できる授業(B表で判定)</p>`:''}${r.length?'':'<div class="empty"><div class="eg" aria-hidden="true">∅</div><p><b>条件に合う講義がありません</b></p><p class="note">キーワードを短くするか、絞り込みを減らしてみてください。</p></div>'}${r.slice(0,shown).map(itemHTML).join('')}${r.length>shown?'<button class="chip more" id="more">さらに表示</button>':''}</section>`;
  v.innerHTML=h;
  const m=$('#more');m&&(m.onclick=()=>{shown+=100;renderList()});
  const fc=$('#fclear');fc&&(fc.onclick=()=>{const q=params();['q','sem','cat','sub','d','per','place','nolot'].forEach(k=>q.delete(k));history.replaceState(null,'','#/'+(q.toString()?'?'+q:''));shown=100;syncCtl();renderList()});

function splitFull(text){

function parseGrade(f){

    if(isNone(v)){unused.push(k);continue}
    const ms=[...v.matchAll(/(\d+(?:\.\d+)?)\s*[%％]/g)];
    // 「（60%）」のようにカッコで囲まれた割合を優先。なければ最初の割合(短い値、または割合が1つだけの長文)

const ROMAN={'Ⅰ':1,'Ⅱ':2,'Ⅲ':3,'Ⅳ':4,'Ⅴ':5},ROMANS=['','Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ'];
const nameKey=n=>zen(String(n||'')).replace(/[\s\u3000]+/g,' ').trim();
function seriesOf(n){
  const s=nameKey(n);
  let m=s.match(/^(.*?)\s*([ⅠⅡⅢⅣⅤ])(\s*[（(][^）)]*[）)])?$/);
  if(m)return{base:m[1]+'|'+(m[3]||'').trim(),idx:ROMAN[m[2]],st:'r'};
  m=s.match(/^(.*\S)\s+(\d)(\s*[（(][^）)]*[）)])?$/);
  if(m&&+m[2]<=9)return{base:m[1]+'|'+(m[3]||'').trim(),idx:+m[2],st:'d'};
  m=s.match(/^(.*\S)\s+(I{1,3}|IV|V)$/);
  if(m)return{base:m[1]+'|',idx:{I:1,II:2,III:3,IV:4,V:5}[m[2]],st:'a'};

}
function buildSeries(){

/* ---------- 同名科目の比較 ---------- */
const GC={};
async function gradeOf(code){
  if(GC[code])return GC[code];
  try{
    const r=await fetch(`data/detail/${encodeURIComponent(code)}.json`);if(!r.ok)throw 0;
    const secs=normalize(await r.json());let rows=[];
    for(const [t,f] of Object.entries(secs))if(kindOf(t)[0]==='grade')rows=rows.concat(parseGrade(Object.fromEntries(Object.entries(f).filter(([,x])=>x&&String(x).trim()))).rows);
    return GC[code]={rows};
  }catch(e){return GC[code]={rows:[],err:1}}
}
const sumBy=(rows,re)=>rows.filter(r=>re.test(r.k)).reduce((a,r)=>a+r.n,0);
const METRIC={
  name:['教員名順',()=>0],
  exam:['試験が少ない順',r=>sumBy(r,/試験|テスト/)],
  report:['レポート・課題が多い順',r=>-sumBy(r,/レポート|課題|作品|発表/)],
  attend:['出席・参加が多い順',r=>-sumBy(r,/出席|貢献|参加|平常/)]};
function cmpBar(rows){
  const tot=rows.reduce((a,r)=>a+r.n,0);
  if(!rows.length)return '<p class="note">成績配分を読み取れませんでした</p>';
  return `<div class="stack">${rows.map((r,i)=>`<i style="width:${r.n/Math.max(tot,100)*100}%;background:var(--c${i%5})"></i>`).join('')}</div><div class="cl">${rows.map((r,i)=>`<span><i class="sw" style="background:var(--c${i%5})"></i>${esc(r.k)} <b>${esc(r.v)}</b></span>`).join('')}</div>`;
}
async function renderCmp(){
  const v=$('#view'),p=params(),n=p.get('n')||'';
  $('#ctl').hidden=true;
  if(!n){
    const m=new Map(),mine0=CLS&&p.get('mine')!=='0';
    for(const c of pool()){if(mine0&&!okFor(c))continue;const k=nameKey(c.n);if(!m.has(k))m.set(k,[]);m.get(k).push(c)}
    const a=[...m].filter(([,x])=>x.length>=3).sort((x,y)=>y[1].length-x[1].length);
    v.innerHTML=`<h2 class="lh" data-e="Compare">科目比較</h2><p class="count">同じ科目名で複数のクラス・教員に分かれている授業を、成績配分で比べられます。</p>${CLS?`<div class="row"><button class="chip" data-cmine="1" aria-pressed="${mine0}">${esc(clsName(CLS))}で受講可のみ</button></div>`:''}<input id="cmpq" type="search" placeholder="科目名で絞り込み" style="width:100%;margin-bottom:8px">`+a.map(([k,x])=>`<a class="item" data-nm="${esc(k.toLowerCase())}" href="#/w?n=${encodeURIComponent(k)}"><b>${esc(k)}</b><span class="meta">${x.length}クラス　${[...new Set(x.map(c=>c.t))].length}人の教員</span></a>`).join('')||'<p class="note">該当なし</p>';
    $('#cmpq').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('#view .item[data-nm]').forEach(el=>{el.hidden=!!q&&!el.dataset.nm.includes(q)})});
    return;

  v.innerHTML=`<a class="back" href="#/w">‹ 科目一覧</a><h2 class="lh" data-e="Compare / 同名科目">${esc(n)}</h2><p class="count">${cs.length}件${mine&&total!==cs.length?`(${esc(clsName(CLS))} で受講できるもの。全 ${total}件)`:''}</p><div class="row">${CLS?`<button class="chip" data-cmine="1" aria-pressed="${!!mine}">${esc(clsName(CLS))}で受講可のみ</button>`:''}${Object.entries(METRIC).map(([k,[l]])=>`<button class="chip" data-co="${k}" aria-pressed="${k===sortKey}">${l}</button>`).join('')}</div><div id="cmplist"></div>`;
  const box=$('#cmplist'),draw=()=>{
    const arr=cs.map(c=>({c,g:GC[c.c]})).sort((a,b)=>{
      const f=METRIC[sortKey][1],x=a.g&&!a.g.err?f(a.g.rows):99,y=b.g&&!b.g.err?f(b.g.rows):99;
      return x-y||a.c.t.localeCompare(b.c.t,'ja');
    });
    box.innerHTML=arr.map(({c,g})=>`<section class="cmp"><div class="cmph"><a href="#/c/${esc(c.c)}"><b>${esc(c.t||'担当未定')}</b></a>${PL.p[c.c]?` <span class="tag s">${stLabel[PL.p[c.c]]}</span>`:''}${badgeHTML(c)}${clashes(c,termOf(c))?' <span class="tag no">重複</span>':''}<button type="button" class="chip cpb" data-cplan="${esc(c.c)}">${PL.p[c.c]==='plan'?'外す':'履修予定に入れる'}</button></div><span class="meta">${c.when.map(w=>esc(w.replace(/[\s\u3000]+/g,' '))).join(' / ')}${c.b&&c.b.cls?'　'+esc(c.b.cls):''}</span>${g?cmpBar(g.rows):'<p class="note">読み込み中…</p>'}</section>`).join('')||'<p class="note">該当する授業がありません。</p>';
  };

/* ---------- 卒業要件 ---------- */
function mdStatus(name){
  if(PL.md[name])return PL.md[name]==='-'?'':PL.md[name];
  const c=DATA.find(x=>PL.p[x.c]&&nameKey(x.n)===nameKey(name));
  return c?PL.p[c.c]:'';
}
function kibanEarn(g){
  let d=0,pl=0;
  if(g.match){const re=new RegExp(g.match);for(const {c,st} of planned()){if(c.b&&re.test(c.b.cat)){st==='done'?d+=crOf(c):pl+=crOf(c)}}}
  const adj=PL.adj[g.id]||0;
  return{d:d+adj,pl};
}
function bar(d,pl,req){
  const w=x=>Math.min(100,x/req*100);
  return `<div class="gbar" role="img" aria-label="${d}/${req}"><i class="d" style="width:${w(d)}%"></i><i class="p" style="width:${Math.max(0,w(d+pl)-w(d))}%"></i></div>`;
}
function stepper(id,val,label){
  return `<span class="stp"><button type="button" data-adj="${id}" data-dv="-1" aria-label="減らす">−</button><b>${label||'手入力'} ${val}</b><button type="button" data-adj="${id}" data-dv="1" aria-label="増やす">＋</button></span>`;
}
function renderGrad(){
  const v=$('#view');$('#ctl').hidden=true;
  if(!MDREQ){v.innerHTML='<h2 class="lh">卒業要件</h2><p class="note">data/mdreq.json が読み込めません。data フォルダに置いてください。</p>';return}
  const GK='kyudai-syllabus-gcourse',clsKey=(upM()||/^S1-(\d\d)$/.exec(CLS||'')||[])[1];
  let gk='';try{gk=localStorage.getItem(GK)||''}catch(e){}
  if(!ARTC[gk])gk=clsKey&&ARTC[clsKey]?clsKey:'31';
  const R=gk==='31'||!COURSEREQ||!COURSEREQ[gk]?MDREQ:COURSEREQ[gk];
  const sel=`<div class="row"><select id="gcourse" aria-label="コース">${Object.entries(ARTC).map(([k,n])=>`<option value="${k}"${k===gk?' selected':''}>${n}コース</option>`).join('')}</select></div>`+(clsKey&&ARTC[clsKey]||!CLS?'':'');
  let out=`<h2 class="lh" data-e="Graduation">卒業要件</h2>${sel}`;
  let doneAll=0,planAll=0;
  // --- 基幹教育
  const K=R.kiban;let kd=0,kp=0,excess=0;const kr=[];
  for(const g of K.groups){
    if(g.other)continue;
    const e=kibanEarn(g),tot=e.d+e.pl;
    if(['kb-en','kb-l2','kb-bun','kb-ri','kb-hs','kb-so','kb-hi'].includes(g.id))excess+=Math.max(0,tot-g.req);
    kr.push({g,e});
  }
  const og=K.groups.find(g=>g.other);
  const oadj=PL.adj[og.id]||0,oauto=Math.min(og.req,excess);
  let hk=`<section class="gsec"><h3>基幹教育科目 <small>${K.total}単位</small></h3>`;
  for(const {g,e} of kr){
    const cap=Math.min(e.d,g.req),capP=Math.min(e.d+e.pl,g.req)-cap;
    kd+=cap;kp+=capP;
    hk+=`<div class="grow"><div class="gh"><b>${esc(g.name)}</b><span class="gn2">${e.d}${e.pl?`(+${e.pl})`:''} / ${g.req}${e.d>=g.req?' ✓':''}</span></div>${bar(e.d,e.pl,g.req)}<p class="srcnote">${esc(g.note||'')}</p>${stepper(g.id,PL.adj[g.id]||0,'手入力の修得単位')}</div>`;
  }
  const od=Math.min(og.req,oauto+oadj);kd+=od;
  hk+=`<div class="grow"><div class="gh"><b>${esc(og.name)}</b><span class="gn2">${od} / ${og.req}${od>=og.req?' ✓':''}</span></div>${bar(od,0,og.req)}<p class="srcnote">${esc(og.note)}(自動: 各区分の超過分 ${oauto}単位)</p>${stepper(og.id,oadj,'手入力(他コース等)')}</div></section>`;
  // --- 専攻教育
  const S=R.senkou;const gs={};
  const cnt=courses=>{let d=0,pl=0;for(const c of courses){const st=mdStatus(c.n);if(st==='done')d+=c.cr;else if(st==='plan')pl+=c.cr}return{d,pl}};
  const courseList=(courses)=>`<details><summary>科目 ${courses.length}件を開く</summary>${courses.map(c=>{const st=mdStatus(c.n);return `<div class="pi mdc"><span class="pit"><b>${c.t?`<span class="mk">${c.t}</span>`:''}${esc(c.n)}</b><span class="meta">${c.cr}単位　<a href="#/?q=${encodeURIComponent(c.n)}">シラバスで探す</a></span>${c.note?`<span class="srcnote">${esc(c.note)}</span>`:''}</span><button type="button" class="chip st${st?' on':''}" data-md="${esc(c.n)}">${st==='done'?'修得済み':st==='plan'?'履修予定':'未'}</button></div>`}).join('')}</details>`;
  let hs=`<section class="gsec"><h3>専攻教育科目 <small>${S.total}単位</small></h3>`;
  for(const g of S.groups){
    if(g.derived)continue;
    let d=0,pl=0,body='';
    if(g.sub){
      for(const sg of g.sub){const c=cnt(sg.courses);d+=c.d;pl+=c.pl;const ok=c.d>=sg.min;body+=`<div class="sgl"><b>${esc(sg.name)}</b> <span class="gn2">${c.d}${c.pl?`(+${c.pl})`:''}単位 ${ok?'✓':`(${sg.min}単位以上が必要)`}</span></div>`+courseList(sg.courses)}
    }else{const c=cnt(g.courses);d=c.d;pl=c.pl;body=courseList(g.courses)}
    gs[g.id]={d,pl};
    const cap=Math.min(d,g.req);
    doneAll+=cap;planAll+=Math.min(d+pl,g.req)-cap;
    hs+=`<div class="grow"><div class="gh"><b>${esc(g.name)}</b><span class="gn2">${d}${pl?`(+${pl})`:''} / ${g.req}${d>=g.req?' ✓':''}</span></div>${bar(d,pl,g.req)}${g.note?`<p class="srcnote">${esc(g.note)}</p>`:''}${body}</div>`;
  }
  const dg=S.groups.find(g=>g.derived),oth=PL.adj['sk-other']||0,OM=R.otherMin||4,SR=id=>(S.groups.find(g=>g.id===id)||{req:0}).req;
  const exD=Math.max(0,(gs['sk-sen']||{d:0}).d-SR('sk-sen'))+Math.max(0,(gs['sk-pbl']||{d:0}).d-SR('sk-pbl'))+oth;
  const exP=Math.max(0,((gs['sk-sen']||{d:0,pl:0}).d+(gs['sk-sen']||{pl:0}).pl)-SR('sk-sen'))+Math.max(0,((gs['sk-pbl']||{d:0,pl:0}).d+(gs['sk-pbl']||{pl:0}).pl)-SR('sk-pbl'))+oth-exD;
  const dd=Math.min(dg.req,exD),dp=Math.min(dg.req-dd,Math.max(0,exP));
  doneAll+=dd;planAll+=dp;
  hs+=`<div class="grow"><div class="gh"><b>${esc(dg.name)}</b><span class="gn2">${dd}${dp?`(+${dp})`:''} / ${dg.req}${dd>=dg.req?' ✓':''}</span></div>${bar(dd,dp,dg.req)}<p class="srcnote">${esc(dg.note)}</p>${stepper('sk-other',oth,'他コースの専門・演習')}<p class="srcnote">他コース科目 ${oth}単位 ${oth>=OM?`(${OM}単位以上の条件を満たしています)`:`(${OM}単位以上が必要)`}</p></div></section>`;
  const tD=kd+doneAll,tP=kp+planAll;
  out+=`<section class="gsec total"><p class="eyebrow">修得済みの単位</p><div class="big"><span data-count="${tD}">${tD}</span><span class="of">/ ${R.total}</span></div><p class="bigsub">あと <b>${Math.max(0,R.total-tD)}</b> 単位${tP?`　・　履修予定を含めると <b>${tD+tP}</b> 単位`:''}</p>${bar(tD,tP,R.total)}<p class="srcnote">各区分は上限(必要単位)までを数えています。</p></section>`+hk+hs;
  out+=`<section class="gsec"><h3>履修条件・注意</h3>${R.rules.map(r=>`<p class="srcnote" style="font-size:.85rem">${esc(r)}</p>`).join('')}<p class="srcnote">出典: ${esc(R.source)}</p><p class="srcnote">単位は履修プランの「修得済み」「履修予定」と、この画面の手入力から集計しています。正式な確認は学務システム・便覧で行ってください。</p></section>`;
  v.innerHTML=out;
}

  if(b=by('[data-tt]')){const p=params();p.set('t',b.dataset.tt);p.delete('s');history.replaceState(null,'','#/t?'+p);renderTT();return}
  if(b=by('[data-nolot]')){const p=params();p.get('nolot')?p.delete('nolot'):p.set('nolot','1');history.replaceState(null,'','#/t?'+p);renderTT();return}
  if(b=by('[data-add]')){const y=scrollY;setPlan(b.dataset.add,'plan');renderTT();scrollTo(0,y);return}
  if(b=by('[data-rm]')){const y=scrollY;setPlan(b.dataset.rm,'');bumpTT();scrollTo(0,y);return}
  if(b=by('[data-done]')){const y=scrollY;setPlan(b.dataset.done,'done');bumpTT();scrollTo(0,y);return}
  if(b=by('[data-back]')){const y=scrollY;setPlan(b.dataset.back,'plan');bumpTT();scrollTo(0,y);return}
  if(b=by('[data-set]')){if(b.dataset.set==='plan'&&CLS&&BYC[b.dataset.code]&&elig(BYC[b.dataset.code])==='no'&&!confirm(clsName(CLS)+' では対象外の授業です。それでも履修予定に入れますか?'))return;setPlan(b.dataset.code,b.dataset.set);const c=BYC[b.dataset.code];const box=$('#relbox');if(c&&box)box.outerHTML=planBoxHTML(c);return}
  if(b=by('#pimg')){try{ttImage(params().get('t')||defTerm())}catch(err){console.error(err);alert('画像を作れませんでした')}return}
  if(b=by('#patb')){const at=reqFor();if(at){at.codes.forEach(c=>{if(!PL.p[c])PL.p[c]='plan'});plSave();renderTT()}return}
  if(b=by('#pexp')){const blob=new Blob([JSON.stringify({v:1,cls:CLS,plan:PL},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='syllabus-plan.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}
  if(b=by('#pimp')){$('#pfile').click();return}
  if(b=by('#pclr')){if(confirm('履修プランを全部消しますか?(卒業要件の手入力は残ります)')){PL.p={};plSave();renderTT()}return}
  if(b=by('[data-co]')){const p=params();p.set('o',b.dataset.co);history.replaceState(null,'','#/w?'+p);renderCmp();return}
  if(b=by('[data-cplan]')){const code=b.dataset.cplan,c=BYC[code];if(c&&PL.p[code]!=='plan'&&CLS&&elig(c)==='no'&&!confirm(clsName(CLS)+' では対象外の授業です。それでも履修予定に入れますか?'))return;setPlan(code,PL.p[code]==='plan'?'':'plan');const y=scrollY;renderCmp().then(()=>scrollTo(0,y));return}
  if(b=by('[data-cmine]')){const p=params();p.get('mine')==='0'?p.delete('mine'):p.set('mine','0');history.replaceState(null,'','#/w?'+p);renderCmp();return}
  if(b=by('[data-md]')){const n=b.dataset.md,cur=mdStatus(n),nx=cur===''?'plan':cur==='plan'?'done':'-';PL.md[n]=nx;if(nx==='-'&&!DATA.some(x=>PL.p[x.c]&&nameKey(x.n)===nameKey(n)))delete PL.md[n];plSave();const y=scrollY,open=[...document.querySelectorAll('#view details')].map(d=>d.open);renderGrad();document.querySelectorAll('#view details').forEach((d,i)=>d.open=!!open[i]);scrollTo(0,y);return}
  if(b=by('[data-adj]')){const id=b.dataset.adj;PL.adj[id]=Math.max(0,(PL.adj[id]||0)+ +b.dataset.dv);plSave();const y=scrollY,open=[...document.querySelectorAll('#view details')].map(d=>d.open);renderGrad();document.querySelectorAll('#view details').forEach((d,i)=>d.open=!!open[i]);scrollTo(0,y);return}
});
$('#view').addEventListener('change',e=>{
  if(e.target.id==='pfile'){
    const f=e.target.files[0];if(!f)return;
    f.text().then(t=>{
      const o=JSON.parse(t),pl=o&&o.plan;
      if(!pl||typeof pl.p!=='object'||Array.isArray(pl.p))throw new Error('形式が違います');
      const n=Object.keys(pl.p).length;
      if(!confirm('読み込むと、いまの履修プランを置き換えます(読み込む内容: '+n+'科目)。よろしいですか?'))return;
      PL={p:pl.p||{},adj:pl.adj||{},md:pl.md||{}};plSave();
      if(typeof o.cls==='string'&&o.cls){CLS=o.cls;try{localStorage.setItem(CKEY,CLS)}catch(_){}}
      renderTT();
    }).catch(()=>alert('読み込めませんでした。書き出したファイル(JSON)を選んでください。'));
    e.target.value='';return;
  }
  if(e.target.id==='acls'){const q=params();e.target.value?q.set('c',e.target.value):q.delete('c');history.replaceState(null,'','#/a?'+q);renderA();return}
  if(e.target.id==='gcourse'){try{localStorage.setItem('kyudai-syllabus-gcourse',e.target.value)}catch(_){}renderGrad();return}
  if(e.target.id==='tcls'){try{localStorage.removeItem('kyudai-syllabus-gcourse')}catch(_){}CLS=e.target.value;try{localStorage.setItem(CKEY,CLS)}catch(_){}renderTT()}
});
function initFeatures(){
  BYC=Object.fromEntries(DATA.map(c=>[c.c,c]));
  buildSeries();
}

Promise.all([fetch('data/index.json',{cache:'no-cache'}).then(r=>r.json()),fetch('data/boilerplate.json').then(r=>r.ok?r.json():null).catch(()=>null),fetch('data/btable.json',{cache:'no-cache'}).then(r=>r.ok?r:fetch('btable.json',{cache:'no-cache'})).then(r=>r.ok?r.json():null).catch(()=>null),fetch('data/mdreq.json').then(r=>r.ok?r.json():null).catch(()=>null),fetch('data/atable.json').then(r=>r.ok?r.json():null).catch(()=>null),fetch('data/coursereq.json').then(r=>r.ok?r.json():null).catch(()=>null),fetch('data/agrid.json').then(r=>r.ok?r.json():null).catch(()=>null)]).then(([j,b,bt,md,at,cr,ag])=>{DATA=j;MDREQ=md;ATABLE=at;COURSEREQ=cr;AGRID=ag;if(bt&&bt.rows){BT=bt.rows;BTV=bt.versions||{};DATA.forEach(c=>{c.b=BT[c.c]})}if(b){(b.labels||[]).forEach(l=>BOIL.labels.add(l));(b.pairs||[]).forEach(([k,x])=>BOIL.pairs.add(k+'\u0000'+x))}initFeatures();route();countUp()}).catch(err=>{console.error(err);$('#view').innerHTML='<p class="note">data/index.json を読み込めません。scrape.py を実行するか、ローカルサーバー経由で開いてください。</p>'});
</script>
