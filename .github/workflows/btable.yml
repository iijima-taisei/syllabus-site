name: B表の自動更新

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 6:00 (日本時間)。GitHub の混雑で数十分遅れることがある
  workflow_dispatch:        # Actions の画面から手動でも実行できる

# 既定は読み取りのみ。書き込みは update ジョブにだけ与える
permissions:
  contents: read

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # データの更新をコミットして push する
      pages: write      # Pages のビルドを依頼する
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install --disable-pip-version-check -r requirements.txt

      - name: 基幹教育院のページを確認して、新しいB表があれば取り込む
        id: fetch
        run: python fetch_btable.py

      - name: コミットして公開
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # 取得したデータ由来の文字列はシェルに直接埋め込まず、環境変数で渡す
          INFO: ${{ steps.fetch.outputs.versions }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/btable.json index.html
          git diff --cached --quiet && { echo "差分なし"; exit 0; }
          git commit -m "B表を自動更新 $INFO"
          git pull --rebase -q
          git push
          # Actions からの push では Pages が自動で動かないことがあるので、明示的にビルドを依頼する
          gh api -X POST "repos/$REPO/pages/builds" || echo "Pages のビルド依頼に失敗(次の push で反映されます)"
