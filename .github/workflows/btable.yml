name: B表の自動更新

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 6:00 (日本時間)。GitHub の混雑で数十分遅れることがある
  workflow_dispatch:        # Actions の画面から手動でも実行できる

permissions:
  contents: write
  pages: write

concurrency:
  group: btable
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pdfplumber

      - name: 基幹教育院のページを確認して、新しいB表があれば取り込む
        id: fetch
        run: python fetch_btable.py

      - name: コミットして公開
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/btable.json index.html
          git diff --cached --quiet && { echo "差分なし"; exit 0; }
          git commit -m "B表を自動更新 ${{ steps.fetch.outputs.versions }}"
          git push
          # Actions からの push では Pages が自動で動かないことがあるので、明示的にビルドを依頼する
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages のビルド依頼に失敗(次の push で反映されます)"
