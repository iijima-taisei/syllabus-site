name: 講義一覧の週次更新

on:
  schedule:
    - cron: "0 20 * * 0"   # 毎週月曜 5:00 (日本時間)
  workflow_dispatch:

# 既定は読み取りのみ。書き込みは update ジョブにだけ与える
permissions:
  contents: read

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # データの更新をコミットして push する
      pages: write      # Pages のビルドを依頼する
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install --disable-pip-version-check -r requirements.txt

      - name: 講義一覧を取り直し、新しい講義の詳細だけ取得
        id: upd
        run: python weekly_update.py

      - name: コミットして公開
        if: steps.upd.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # 取得したデータ由来の文字列はシェルに直接埋め込まず、環境変数で渡す
          INFO: ${{ steps.upd.outputs.summary }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/detail data/yomi.json data/skipped.json index.html
          git diff --cached --quiet && { echo "差分なし"; exit 0; }
          git commit -m "講義一覧を週次更新 ($INFO)"
          git pull --rebase -q
          git push
          gh api -X POST "repos/$REPO/pages/builds" || echo "Pages のビルド依頼に失敗(次の push で反映されます)"
