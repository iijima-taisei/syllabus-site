name: 講義一覧の週次更新

on:
  schedule:
    - cron: "0 20 * * 0"   # 毎週月曜 5:00 (日本時間)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 lxml html5lib pykakasi

      - name: 講義一覧を取り直し、新しい講義の詳細だけ取得
        id: upd
        run: python weekly_update.py

      - name: コミットして公開
        if: steps.upd.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/detail data/yomi.json data/skipped.json index.html
          git diff --cached --quiet && { echo "差分なし"; exit 0; }
          git commit -m "講義一覧を週次更新 (${{ steps.upd.outputs.summary }})"
          git pull --rebase -q
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages のビルド依頼に失敗(次の push で反映されます)"
